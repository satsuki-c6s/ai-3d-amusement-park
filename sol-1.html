<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<style>
  :root { color-scheme:light; --ink:#234e50; --paper:rgba(255,253,245,.87); --line:rgba(35,78,80,.17); }
  * { box-sizing:border-box; }
  body { margin:0; overflow:hidden; background:#dce9e5; color:var(--ink); font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; }
  canvas { display:block; width:100%; height:100%; outline:none; }
  #view { position:fixed; inset:0; }
  .ui { position:fixed; z-index:2; pointer-events:none; }
  header { top:30px; left:34px; }
  .eyebrow { display:flex; align-items:center; gap:9px; font-size:10px; letter-spacing:3px; font-weight:700; }
  .dot { width:7px; height:7px; border-radius:50%; background:#e78a66; box-shadow:0 0 0 5px #e78a661c; }
  h1 { margin:13px 0 8px; font-size:43px; line-height:.94; letter-spacing:-2px; font-weight:800; }
  h1 span { display:block; font-weight:400; letter-spacing:9px; font-size:23px; margin-top:9px; }
  .subtitle { font-size:11px; letter-spacing:2px; opacity:.75; margin-top:17px; }
  .top-right { top:31px; right:34px; display:flex; align-items:center; gap:14px; }
  .open { font-size:10px; letter-spacing:2px; font-weight:700; }
  button { pointer-events:auto; border:1px solid var(--line); color:var(--ink); background:var(--paper); padding:12px 17px; border-radius:40px; display:flex; align-items:center; gap:11px; cursor:pointer; font:600 11px Arial,sans-serif; letter-spacing:1px; box-shadow:0 5px 25px #163c4510; backdrop-filter:blur(14px); transition:transform .2s,background .3s; }
  button:hover { transform:translateY(-2px); background:#fffdf5; }
  button svg { width:18px; height:18px; }
  .switch { width:28px; height:16px; border-radius:20px; background:#bfd6cc; padding:3px; }
  .switch i { display:block; width:10px; height:10px; border-radius:50%; background:white; transition:transform .3s; }
  body.night { --ink:#f3e8cd; --paper:rgba(20,36,53,.85); --line:rgba(239,223,190,.2); }
  body.night .switch { background:#dfac63; }
  body.night .switch i { transform:translateX(12px); }
  body.night button:hover { background:#253b50; }
  .story { left:34px; bottom:31px; padding:20px 23px; background:var(--paper); border:1px solid var(--line); border-radius:15px; backdrop-filter:blur(14px); max-width:350px; box-shadow:0 8px 40px #183e4310; }
  .story .number { font-size:9px; letter-spacing:2.3px; opacity:.6; }

  .edition { font-size:9px; letter-spacing:2px; margin-bottom:15px; opacity:.55; }
  .compass { width:43px; height:43px; margin:0 0 19px auto; border:1px solid var(--line); border-radius:50%; display:grid; place-items:center; font-size:10px; }
  .compass span { display:block; transform:rotate(-35deg); }
  #loading { position:fixed; inset:0; display:grid; place-items:center; background:#dce9e5; z-index:10; color:#234e50; letter-spacing:5px; font-size:12px; transition:opacity .6s; pointer-events:none; }
  @media(max-width:800px) {
    header { top:22px; left:22px; }

    h1 span { font-size:16px; }
    .top-right { right:20px; top:22px; }
    .open,.subtitle { display:none; }
    .story { bottom:20px; left:20px; padding:15px; max-width:290px; }
    .help { right:20px; bottom:22px; }
    .edition,.compass { display:none; }
  }
</style>

<body>

  <h1>AURORA<span>P A R K</span></h1>

<div class="ui top-right">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const TAU = Math.PI * 2;
const V = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
let seed = 271828;
function random() {
  seed = (Math.imul(seed,1664525) + 1013904223) >>> 0;
  return seed / 4294967296;
}

const scene = new THREE.Scene();
scene.background = new THREE.Color('#dce9e5');
scene.fog = new THREE.Fog('#dce9e5',145,290);

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  alpha:false,
  powerPreference:'high-performance'
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('view').appendChild(renderer.domElement);

const viewHeight = 70;
const camera = new THREE.OrthographicCamera(
  -viewHeight*innerWidth/innerHeight/2,
  viewHeight*innerWidth/innerHeight/2,
  viewHeight/2,
  -viewHeight/2,
  .1,
  400
);
camera.position.set(78,67,91);

const controls = new OrbitControls(camera,renderer.domElement);
controls.target.set(0,4,0);
controls.enableDamping = true;
controls.dampingFactor = .065;
controls.minZoom = .65;
controls.maxZoom = 3.2;
controls.minPolarAngle = .24;
controls.maxPolarAngle = Math.PI/2-.09;
controls.maxTargetRadius = 22;
controls.update();

const hemi = new THREE.HemisphereLight('#e4f7ff','#b4a382',2.25);
scene.add(hemi);

const sun = new THREE.DirectionalLight('#fff0d0',3.25);
sun.position.set(-32,65,30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{
  left:-55,right:55,top:52,bottom:-52,near:1,far:150
});
sun.shadow.bias = -.00025;
sun.shadow.normalBias = .035;
sun.shadow.radius = 3;
sun.target.position.set(0,0,0);
scene.add(sun,sun.target);

const fill = new THREE.DirectionalLight('#c3eaff',.65);
fill.position.set(35,28,-35);
scene.add(fill);

function material(color,roughness=.7,metalness=0) {
  return new THREE.MeshStandardMaterial({color,roughness,metalness});
}
const M = {
  ivory:material('#fff0cf'),
  white:material('#fff9e9'),
  teal:material('#287d80',.48,.15),
  dark:material('#244c57',.5,.2),
  aqua:material('#7bc7bd'),
  mint:material('#acd6b0'),
  coral:material('#e98169'),
  red:material('#d95f50'),
  gold:material('#efbd61',.38,.38),
  brass:material('#c9974e',.4,.5),
  blue:material('#75b7cc'),
  pink:material('#eeb4ad'),
  wood:material('#ac7752'),
  trunk:material('#956a4e'),
  leaf:material('#508968'),
  leaf2:material('#76a47a'),
  leaf3:material('#91b180'),
  stone:material('#e8dbc2'),
  pavement:material('#efe2c7'),
  water:material('#50bac4',.18,.35),
  skin:material('#f0c59e'),
  tire:material('#29424a'),
  glass:material('#90c8ce',.2,.25)
};

const emissiveMaterials = [];
function luminous(color,day=.06,night=2) {
  const m = material(color,.4,.05);
  m.emissive = new THREE.Color(color);
  m.emissiveIntensity = day;
  emissiveMaterials.push({m,day,night});
  return m;
}
const warmBulb = luminous('#ffdf91',.35,4);
const pearlBulb = luminous('#fff2d4',.15,3.1);
const pinkBulb = luminous('#ff927e',.08,2.5);
const railMat = luminous('#eb7960',.025,.58);
const jetMat = luminous('#a7e6e8',.08,.95);
jetMat.transparent = true;
jetMat.opacity = .72;

const unitBox = new THREE.BoxGeometry(1,1,1);
const unitSphere = new THREE.SphereGeometry(1,14,10);
const unitCylinder = new THREE.CylinderGeometry(1,1,1,12);
const unitIco = new THREE.IcosahedronGeometry(1,1);
const axisY = V(0,1,0);

function mesh(geometry,mat,parent=scene) {
  const o = new THREE.Mesh(geometry,mat);
  o.castShadow = true;
  o.receiveShadow = true;
  parent.add(o);
  return o;
}
function box(parent,size,pos,mat) {
  const o = mesh(unitBox,mat,parent);
  o.scale.set(...size);
  o.position.set(...pos);
  return o;
}
function ball(parent,pos,size,mat) {
  const o = mesh(unitSphere,mat,parent);
  o.position.set(...pos);
  if(typeof size==='number') o.scale.setScalar(size);
  else o.scale.set(...size);
  return o;
}
function cylinder(parent,r,h,pos,mat,rt=r,segments=32) {
  const o = mesh(new THREE.CylinderGeometry(rt,r,h,segments),mat,parent);
  o.position.set(...pos);
  return o;
}
function beam(parent,a,b,r,mat) {
  const aa = Array.isArray(a) ? V(...a) : a;
  const bb = Array.isArray(b) ? V(...b) : b;
  const o = mesh(unitCylinder,mat,parent);
  o.position.copy(aa).add(bb).multiplyScalar(.5);
  o.scale.set(r,aa.distanceTo(bb),r);
  o.quaternion.setFromUnitVectors(axisY,bb.clone().sub(aa).normalize());
  return o;
}
function torus(parent,r,t,pos,mat,arc=TAU) {
  const o = mesh(new THREE.TorusGeometry(r,t,8,112,arc),mat,parent);
  o.position.set(...pos);
  return o;
}
function group(parent=scene,pos=[0,0,0]) {
  const g = new THREE.Group();
  g.position.set(...pos);
  parent.add(g);
  return g;
}
function roundShape(w,h,r) {
  const s = new THREE.Shape(), x=-w/2,y=-h/2;
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y);
  s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r);
  s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h);
  s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r);
  s.quadraticCurveTo(x,y,x+r,y);
  return s;
}
function flatRound(parent,w,d,r,y,mat,x=0,z=0) {
  const o = mesh(new THREE.ShapeGeometry(roundShape(w,d,r)),mat,parent);
  o.rotation.x = -Math.PI/2;
  o.position.set(x,y,z);
  return o;
}
function bulbs(parent,positions,r=.10,mat=warmBulb) {
  const obj = new THREE.InstancedMesh(unitSphere,mat,positions.length);
  const dummy = new THREE.Object3D();
  positions.forEach((p,i)=>{
    dummy.position.set(...p);
    dummy.scale.setScalar(r);
    dummy.updateMatrix();
    obj.setMatrixAt(i,dummy.matrix);
  });
  obj.instanceMatrix.needsUpdate = true;
  parent.add(obj);
  return obj;
}

// テクスチャはすべて、このファイル内の canvas で生成する。
function grassTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#99b58a';
  ctx.fillRect(0,0,512,512);
  for(let i=0;i<18000;i++) {
    const x=random()*512,y=random()*512;
    ctx.fillStyle = i%3===0
      ? 'rgba(225,230,171,.19)'
      : 'rgba(54,107,66,.09)';
    ctx.fillRect(x,y,1+random()*2,1+random()*3);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(10,8);
  t.anisotropy = 8;
  return t;
}
const grassMat = material('#ffffff');
grassMat.map = grassTexture();

const island = group();
const base = mesh(new THREE.ExtrudeGeometry(roundShape(72,54,4),{
  depth:1.7,
  bevelEnabled:true,
  bevelSize:.28,
  bevelThickness:.22,
  bevelSegments:3,
  steps:1
}),M.dark,island);
base.rotation.x = -Math.PI/2;
base.position.y = -1.85;
flatRound(island,72,54,4,.08,M.ivory);
flatRound(island,69.8,51.8,3.5,.10,grassMat);
flatRound(island,70.8,52.8,3.7,-.01,M.gold);

const floorMat = material('#dce9e5',1);
const floor = mesh(new THREE.PlaneGeometry(2000,2000),floorMat);
floor.rotation.x = -Math.PI/2;
floor.position.y = -2.2;
floor.castShadow = false;

function shadowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64,64,1,64,64,64);
  g.addColorStop(0,'rgba(24,57,44,.29)');
  g.addColorStop(.55,'rgba(24,57,44,.16)');
  g.addColorStop(1,'rgba(24,57,44,0)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const shadowMap = shadowTexture();
function softShadow(x,z,sx,sz) {
  const m = new THREE.MeshBasicMaterial({
    map:shadowMap,transparent:true,depthWrite:false
  });
  const o = new THREE.Mesh(new THREE.PlaneGeometry(sx,sz),m);
  o.rotation.x = -Math.PI/2;
  o.position.set(x,.125,z);
  scene.add(o);
}
softShadow(-21,-11,26,13);
softShadow(-19,10,16,16);
softShadow(13,-5,28,22);

function path(points,width) {
  const curve = new THREE.CatmullRomCurve3(points.map(p=>V(p[0],.16,p[1])));
  const n=100,verts=[],uv=[],indices=[];
  for(let i=0;i<=n;i++) {
    const u=i/n,p=curve.getPoint(u),t=curve.getTangent(u);
    const side=V(-t.z,0,t.x).normalize().multiplyScalar(width/2);
    verts.push(
      p.x+side.x,p.y,p.z+side.z,
      p.x-side.x,p.y,p.z-side.z
    );
    uv.push(0,u*20,1,u*20);
    if(i<n) {
      const j=i*2;
      indices.push(j,j+2,j+1,j+1,j+2,j+3);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const o=mesh(geo,M.pavement);
  o.castShadow=false;
  return curve;
}
const promenade = path([[-30,18],[-17,18],[-5,19],[10,19],[29,17]],3.3);
path([[-5.5,25],[-5.5,15],[-6,7],[-6,0],[-7,-10],[-6,-21]],3.6);
path([[-7,-4],[-14,-3],[-21,-1]],2.8);
path([[-6,10],[-12,10],[-19,10]],2.8);
path([[-29,-21],[-15,-19],[-4,-18],[14,-18],[29,-19]],2.6);

cylinder(scene,4.4,.12,[-6,.19,0],M.pavement);
cylinder(scene,10.8,.12,[-21,.18,-11],M.stone,10.8,96);
cylinder(scene,10.15,.04,[-21,.26,-11],grassMat,10.15,96);
cylinder(scene,6.65,.12,[-19,.22,10],M.stone,6.65,80);
const plazaRing = torus(scene,6.28,.06,[-19,.31,10],M.ivory);
plazaRing.rotation.x = Math.PI/2;

// 観覧車。輪とゴンドラを別の回転として管理する。
const wheelBase = group(scene,[-21,0,-11]);
cylinder(wheelBase,3.3,.35,[0,.4,0],M.stone);
for(const z of [-2,2]) {
  for(const x of [-3.5,3.5]) {
    box(wheelBase,[1.5,.35,1.5],[x,.34,z],M.ivory);
    beam(wheelBase,[x,.5,z],[0,12,z*.32],.24,M.teal);
    beam(wheelBase,[x,.55,z],[0,12,z*.32],.075,M.ivory).position.z += .20;
  }
}
beam(wheelBase,[0,12,-2.1],[0,12,2.1],.34,M.brass);

const wheel = group(scene,[-21,12,-11]);
wheel.name = 'Ferris wheel · rotating assembly';
const radius = 9.35;

for(const z of [-.55,.55]) {
  torus(wheel,radius,.155,[0,0,z],M.ivory);
  torus(wheel,radius-.42,.065,[0,0,z],M.gold);
  for(let i=0;i<12;i++) {
    const a=i*TAU/12;
    beam(
      wheel,[0,0,z],
      [radius*Math.cos(a),radius*Math.sin(a),z],
      .065,i%2?M.ivory:M.coral
    );
  }
}
for(let i=0;i<12;i++) {
  const a=i*TAU/12;
  beam(
    wheel,
    [radius*Math.cos(a),radius*Math.sin(a),-.55],
    [radius*Math.cos(a),radius*Math.sin(a),.55],
    .09,M.brass
  );
}
const hub = cylinder(wheel,.73,1.65,[0,0,0],M.coral);
hub.rotation.x = Math.PI/2;
ball(wheel,[0,0,1.0],[.48,.48,.20],M.gold);

const wheelBulbs=[];
for(let i=0;i<72;i++) {
  const a=i*TAU/72;
  wheelBulbs.push([radius*Math.cos(a),radius*Math.sin(a),.74]);
}
bulbs(wheel,wheelBulbs,.105,pearlBulb);

const gondolas=[];
const cabinColors=[M.coral,M.aqua,M.gold,M.blue];
for(let i=0;i<12;i++) {
  const a=i*TAU/12;
  const g=group(wheel,[radius*Math.cos(a),radius*Math.sin(a),0]);
  g.name=`Level gondola ${i+1}`;
  beam(g,[0,0,0],[0,-.67,0],.075,M.dark);
  ball(g,[0,-.22,0],.15,M.gold);
  box(g,[1.6,.43,1.27],[0,-1.67,0],cabinColors[i%4]);
  box(g,[1.43,.11,1.16],[0,-1.40,0],M.ivory);
  box(g,[1.44,.58,.055],[0,-1.07,-.53],M.glass);
  box(g,[.055,.58,1.04],[-.7,-1.07,0],M.glass);
  box(g,[.055,.58,1.04],[.7,-1.07,0],M.glass);
  for(const x of [-.73,.73]) {
    for(const z of [-.55,.55]) {
      beam(g,[x,-1.5,z],[x,-.70,z],.035,M.ivory);
    }
  }
  box(g,[1.55,.055,.055],[0,-1.15,.60],M.brass);
  ball(g,[0,-.68,0],[.97,.20,.78],cabinColors[i%4]);
  box(g,[1.84,.09,1.49],[0,-.72,0],M.ivory);
  if(i%2===0) {
    ball(g,[-.27,-1.05,.07],.18,M.skin);
    box(g,[.28,.29,.25],[-.27,-1.32,.07],M.dark);
    ball(g,[.27,-1.03,.07],.17,M.skin);
    box(g,[.27,.28,.25],[.27,-1.30,.07],M.coral);
  }
  bulbs(g,[[-.68,-.76,.65],[.68,-.76,.65]],.055,warmBulb);
  gondolas.push(g);
}

// 閉じたコースター。最初の区間は垂直面内の一回転ループ。
class VerticalLoop extends THREE.Curve {
  constructor() {
    super();
    this.arcLengthDivisions=600;
  }
  getPoint(t,target=new THREE.Vector3()) {
    const a=t*TAU;
    return target.set(
      12+8.5*Math.sin(a),
      2.8+8.5*(1-Math.cos(a)),
      -10+3*t
    );

const frameCount=1400;
const tangents=[],ups=[];
for(let i=0;i<=frameCount;i++) {
  const t=coasterCurve.getTangentAt(i/frameCount).normalize();
  tangents.push(t);
  if(i===0) {
    ups.push(V(0,1,0).addScaledVector(t,-t.y).normalize());
  } else {
    const q=new THREE.Quaternion().setFromUnitVectors(tangents[i-1],t);
    const up=ups[i-1].clone().applyQuaternion(q);
    up.addScaledVector(t,-up.dot(t)).normalize();
    ups.push(up);
  }
}
const closureAngle=Math.atan2(
  tangents[0].dot(ups[frameCount].clone().cross(ups[0])),
  THREE.MathUtils.clamp(ups[frameCount].dot(ups[0]),-1,1)
);
for(let i=0;i<=frameCount;i++) {
  ups[i].applyAxisAngle(tangents[i],closureAngle*i/frameCount);
}

function trackFrame(u) {
  u=((u%1)+1)%1;
  const f=u*frameCount,i=Math.floor(f),a=f-i;
  const t=coasterCurve.getTangentAt(u).normalize();
  const up=ups[i].clone().lerp(ups[i+1],a).normalize();
  const side=t.clone().cross(up).normalize();
  up.copy(side).cross(t).normalize();
  return {p:coasterCurve.getPointAt(u),t,up,side};
}

  const x=w/2,z=d/2;
  const vertices=[
    -x,y,-z, x,y,-z, 0,y+rise,-z,
    -x,y,z, 0,y+rise,z, x,y,z,
    -x,y,-z, 0,y+rise,-z, 0,y+rise,z,
    -x,y,-z, 0,y+rise,z, -x,y,z,
    x,y,-z, x,y,z, 0,y+rise,z,
    x,y,-z, 0,y+rise,z, 0,y+rise,-z
  ];
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
  geo.computeVertexNormals();
  return mesh(geo,mat,parent);
}

// 街灯と夜間照明。
const nightLights=[];
function nightPoint(color,intensity,distance,pos,parent=scene) {
  const p=new THREE.PointLight(color,0,distance,2);
  p.position.set(...pos);
  parent.add(p);

}
function glowTexture() {
  const c=document.createElement('canvas');
  c.width=c.height=128;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,233,174,.85)');
  g.addColorStop(.12,'rgba(255,217,145,.45)');
  g.addColorStop(.4,'rgba(255,199,111,.10)');
  g.addColorStop(1,'rgba(255,192,100,0)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const glowMap=glowTexture(),glows=[];
function glow(parent,x,y,z,size=2.5) {
  const mat=new THREE.SpriteMaterial({
    map:glowMap,
    transparent:true,
    depthWrite:false,
    blending:THREE.AdditiveBlending,
    opacity:0
  });
  const s=new THREE.Sprite(mat);
  s.position.set(x,y,z);
  s.scale.set(size,size,1);
  parent.add(s);
  glows.push(s);
  return s;
}
function lamp(x,z,index) {
  cylinder(scene,.32,.18,[x,.28,z],M.stone);
  beam(scene,[x,.35,z],[x,3.45,z],.075,M.dark);
  cylinder(scene,.23,.12,[x,3.30,z],M.brass);
  ball(scene,[x,3.66,z],[.27,.39,.27],pearlBulb);
  cylinder(scene,.36,.13,[x,4.02,z],M.teal,.18);
  ball(scene,[x,4.15,z],.08,M.gold);
  for(const a of [0,Math.PI/2,Math.PI,Math.PI*1.5]) {
    const xx=x+Math.cos(a)*.24,zz=z+Math.sin(a)*.24;
    beam(scene,[xx,3.32,zz],[xx,3.98,zz],.025,M.dark);
  }
  glow(scene,x,3.65,z,2.1);
  if(index%3===0) nightPoint('#ffd599',23,8,[x,3.5,z]);
}

function setNight(value) {
  night=!!value;
  document.body.classList.toggle('night',night);
  nightButton.setAttribute('aria-pressed',String(night));
  document.getElementById('timeText').textContent=night?'NIGHTFALL':'DAYTIME';
  document.getElementById('timeIcon').innerHTML=night
    ? '<path d="M20.8 14A9 9 0 0 1 10 3.2 9 9 0 1 0 20.8 14Z"/><path d="M18 2v4m-2-2h4"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4.2 4.2l2.1 2.1m11.4 11.4 2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>';

  const sky=night?'#101e34':'#dce9e5';
  scene.background.set(sky);
  scene.fog.color.set(sky);
  floorMat.color.set(night?'#182a3b':'#dce9e5');
  hemi.color.set(night?'#b1c7ee':'#e4f7ff');
  hemi.groundColor.set(night?'#486575':'#b4a382');
  hemi.intensity=night?.72:2.25;
  sun.color.set(night?'#adcaff':'#fff0d0');
  sun.intensity=night?.90:3.25;
  fill.intensity=night?.36:.65;
  renderer.toneMappingExposure=night?1.18:1.08;
  emissiveMaterials.forEach(o=>{
    o.m.emissiveIntensity=night?o.night:o.day;
  });
  nightLights.forEach(o=>{
    o.light.intensity=night?o.intensity:0;
  });
  glows.forEach(s=>{
    s.material.opacity=night?.83:0;
  });
  starMaterial.opacity=night?.9:0;
  moon.visible=night;
}
nightButton.addEventListener('click',()=>setNight(!night));

};

setNight(false);

const carBasis=new THREE.Matrix4();
function updateCars() {
  for(let i=0;i<cars.length;i++) {
    const u=((coasterProgress-i*2.50/trackLength)%1+1)%1;
    const f=trackFrame(u);
    cars[i].position.copy(f.p).addScaledVector(f.up,.045);
    carBasis.makeBasis(f.t,f.up,f.side);
    cars[i].quaternion.setFromRotationMatrix(carBasis);
  }
}
updateCars();
scene.updateMatrixWorld(true);

// 描画回数ではなく実時間から状態を直接計算する。
// 低 FPS や重い描画でも、経過秒数に対する回転速度は変わらない。
const animationStart=performance.now();
const wheelAngularSpeed=.14;       // rad/s：約45秒で一周
const carouselAngularSpeed=.245;   // rad/s
const coasterSpeed=6.8;            // ワールド単位/s

function animate() {
  requestAnimationFrame(animate);

  const elapsed=(performance.now()-animationStart)/1000;

  wheel.rotation.z=elapsed*wheelAngularSpeed;
  for(const gondola of gondolas) {
    // 親の輪の回転を厳密に相殺し、世界座標で水平を保つ。
    gondola.rotation.z=-wheel.rotation.z;
  }

  coasterProgress=(
    initialCoasterProgress+elapsed*coasterSpeed/trackLength
  )%1;
  updateCars();

  carousel.rotation.y=-elapsed*carouselAngularSpeed;
  horses.forEach((h,i)=>{
    h.position.y=2.08+Math.sin(elapsed*1.65+i*TAU/8)*.25;
  });
  jetMat.opacity=.68+Math.sin(elapsed*2.2)*.045;
  centerJet.scale.x=.045*(1+Math.sin(elapsed*4)*.08);
  centerJet.scale.z=centerJet.scale.x;
  balloons.rotation.z=Math.sin(elapsed*.8)*.025;
  flag.rotation.y=Math.sin(elapsed*1.7)*.20;
  starMaterial.opacity=night?.76+Math.sin(elapsed*.5)*.12:0;

  controls.update();
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);

const loading=document.getElementById('loading');
loading.style.opacity='0';
setTimeout(()=>loading.remove(),700);

addEventListener('resize',()=>{
  const aspect=innerWidth/innerHeight;
  camera.left=-viewHeight*aspect/2;
  camera.right=viewHeight*aspect/2;
  camera.top=viewHeight/2;
  camera.bottom=-viewHeight/2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
