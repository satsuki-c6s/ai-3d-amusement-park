<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Fun Park Diorama</title>
<style>

  #toggle:hover{background:#fff}

</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><button id="toggle">🌙 夜にする</button><span id="info">ドラッグで回転 / ホイールで拡大縮小</span></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const V3 = THREE.Vector3;
let seed = 987654321;
function rand(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

// ---------- renderer / scene / camera ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe5ff, 150, 420);
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1200);
camera.position.set(72, 52, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-6, 6, -4);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.03;
controls.minDistance = 8;
controls.maxDistance = 320;
controls.update();

// ---------- helpers ----------
function std(color, o = {}) { return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.75, metalness: 0.05 }, o)); }
function add(parent, geo, material, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, material); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
function beam(parent, a, b, r, material) {
  const d = new V3().subVectors(b, a); const len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 8), material);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(new V3(0, 1, 0), d.normalize());
  m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
function canvasTex(size, draw) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); draw(g, size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
}
function rrect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r); g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath(); g.fill(); }
function textTexture(text, w, h, bg, fg) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, w, h); g.strokeStyle = fg; g.lineWidth = 8; g.strokeRect(8, 8, w - 16, h - 16);
  g.fillStyle = fg; g.font = `bold ${Math.floor(h * 0.55)}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, w / 2, h / 2 + 3);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const nightLights = [], emissiveMats = [];
function nightLight(color, intensity, dist, x, y, z) {
  const l = new THREE.PointLight(color, 0, dist, 2); l.position.set(x, y, z); l.userData.n = intensity; nightLights.push(l); scene.add(l); return l;
}
function glowMat(color, n = 2) {
  const m = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0, roughness: 0.4 });
  m.userData.n = n; emissiveMats.push(m); return m;
}

// ---------- textures ----------
const grassTex = canvasTex(256, (g, s) => {
  g.fillStyle = '#5b9a3e'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 5000; i++) { g.fillStyle = `hsl(${92 + rand() * 28},${45 + rand() * 25}%,${28 + rand() * 22}%)`; g.fillRect(rand() * s, rand() * s, 1 + rand() * 2, 1 + rand() * 3); }
});
grassTex.repeat.set(45, 45);
const cobbleTex = canvasTex(256, (g, s) => {
  g.fillStyle = '#6a655b'; g.fillRect(0, 0, s, s);
  const n = 8, c = s / n;
  for (let j = 0; j < n; j++) for (let i = -1; i <= n; i++) {
    const off = (j % 2) * c / 2; g.fillStyle = `hsl(${35 + rand() * 12},${10 + rand() * 12}%,${55 + rand() * 20}%)`;
    rrect(g, i * c + off + 2, j * c + 2, c - 4, c - 4, 5);
  }
});
const stripeTex = canvasTex(512, (g, s) => { const n = 16; for (let i = 0; i < n; i++) { g.fillStyle = i % 2 ? '#f6f3ea' : '#d92f3f'; g.fillRect(i * s / n, 0, s / n + 1, s); } });
const awningTex = canvasTex(256, (g, s) => { const n = 8; for (let i = 0; i < n; i++) { g.fillStyle = i % 2 ? '#fdfdfd' : '#2a7bd5'; g.fillRect(i * s / n, 0, s / n + 1, s); } });
const brickTex = canvasTex(256, (g, s) => {
  g.fillStyle = '#a99d86'; g.fillRect(0, 0, s, s); const bh = 16, bw = 32;
  for (let y = 0; y < s; y += bh) { const off = ((y / bh) % 2) * bw / 2; for (let x = -bw; x < s; x += bw) { g.fillStyle = `hsl(${30 + rand() * 8},${18 + rand() * 14}%,${62 + rand() * 12}%)`; g.fillRect(x + off + 1, y + 1, bw - 2, bh - 2); } }
});
brickTex.repeat.set(4, 2);

// ---------- sky, stars, sun & moon ----------
const skyGeo = new THREE.SphereGeometry(500, 32, 24);
const skyColors = new Float32Array(skyGeo.attributes.position.count * 3);
skyGeo.setAttribute('color', new THREE.BufferAttribute(skyColors, 3));
const sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
scene.add(sky);
function setSky(topHex, botHex) {
  const top = new THREE.Color(topHex), bot = new THREE.Color(botHex), c = new THREE.Color();
  const pos = skyGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const h = Math.max(0, pos.getY(i) / 500);
    c.copy(bot).lerp(top, Math.pow(h, 0.65)); c.toArray(skyColors, i * 3);
  }
  skyGeo.attributes.color.needsUpdate = true;
}
const starPos = [];
for (let i = 0; i < 1800; i++) { const th = rand() * Math.PI * 2, y = 0.06 + rand() * 0.94, r = Math.sqrt(1 - y * y); starPos.push(r * Math.cos(th) * 470, y * 470, r * Math.sin(th) * 470); }
const starGeo = new THREE.BufferGeometry(); starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 2.4, transparent: true, opacity: 0, fog: false, depthWrite: false }));
scene.add(stars);
const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(16, 24, 16), new THREE.MeshBasicMaterial({ color: 0xfff0a0, fog: false }));
sunMesh.position.set(70, 100, 40).normalize().multiplyScalar(460); scene.add(sunMesh);
const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(11, 24, 16), new THREE.MeshBasicMaterial({ color: 0xe9eeff, fog: false }));
moonMesh.position.set(-60, 80, -30).normalize().multiplyScalar(460); scene.add(moonMesh);

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0xbfdfff, 0x56733d, 0.9); scene.add(hemi);
const ambient = new THREE.AmbientLight(0xffffff, 0.15); scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff1d6, 2.6);
sun.position.set(70, 100, 40); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -95, right: 95, top: 95, bottom: -95, near: 10, far: 300 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
scene.add(sun); scene.add(sun.target);

// ---------- ground & paths ----------
const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
function pathStrip(x1, z1, x2, z2, w, y = 0.02) {
  const dx = x2 - x1, dz = z2 - z1, len = Math.hypot(dx, dz);
  const geo = new THREE.PlaneGeometry(w, len); geo.rotateX(-Math.PI / 2);
  const tex = cobbleTex.clone(); tex.repeat.set(w / 6, len / 6); tex.needsUpdate = true;
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 }));
  m.position.set((x1 + x2) / 2, y, (z1 + z2) / 2); m.rotation.y = Math.atan2(dx, dz); m.receiveShadow = true; scene.add(m);
}
pathStrip(0, 70, 0, 8, 9);
pathStrip(12, -12, 31, -24, 6);
pathStrip(-10, 8, -19, 21, 6);
pathStrip(0, -20, 0, -39, 7);
{
  const geo = new THREE.CircleGeometry(15, 48); geo.rotateX(-Math.PI / 2);
  const tex = cobbleTex.clone(); tex.repeat.set(5, 5); tex.needsUpdate = true;
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 }));
  m.position.set(0, 0.03, -5); m.receiveShadow = true; scene.add(m);
}
// outside road + parked cars
{
  const road = new THREE.Mesh(new THREE.PlaneGeometry(300, 9), std(0x3b3b40, { roughness: 1 })); road.rotation.x = -Math.PI / 2; road.position.set(0, 0.02, 76); road.receiveShadow = true; scene.add(road);
  const line = new THREE.Mesh(new THREE.PlaneGeometry(300, 0.3), std(0xf0e8b0)); line.rotation.x = -Math.PI / 2; line.position.set(0, 0.03, 76); scene.add(line);
  const carCols = [0xd63a3a, 0x3a6fd6, 0xf0c030, 0xffffff, 0x2a9d6a];
  for (let i = 0; i < 5; i++) {
    const g = new THREE.Group(); g.position.set(-60 + i * 28 + (i % 2) * 6, 0, 76 + (i % 2 ? 2.4 : -2.4)); g.rotation.y = i % 2 ? Math.PI : 0;
    add(g, new THREE.BoxGeometry(4.2, 1, 2), std(carCols[i], { metalness: 0.4, roughness: 0.4 }), 0, 0.8, 0);
    add(g, new THREE.BoxGeometry(2.2, 0.8, 1.8), std(0x9fd8ff, { metalness: 0.3, roughness: 0.2 }), -0.2, 1.7, 0);
    for (const dx of [-1.4, 1.4]) for (const dz of [-1, 1]) { const w = add(g, new THREE.CylinderGeometry(0.4, 0.4, 0.3, 12), std(0x222222), dx, 0.4, dz); w.rotation.x = Math.PI / 2; }
    scene.add(g);
  }
}

// ---------- trees (instanced) ----------
function distSeg(px, pz, ax, az, bx, bz) { const dx = bx - ax, dz = bz - az; const t = Math.max(0, Math.min(1, ((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz))); return Math.hypot(px - ax - t * dx, pz - az - t * dz); }
function clearOf(x, z) {
  if (Math.abs(x) < 9 && z > 2 && z < 72) return false;
  if (Math.hypot(x, z + 5) < 20) return false;
  if (Math.hypot(x - 38, z + 28) < 20) return false;
  if (x > -66 && x < -2 && z > -37 && z < 35) return false;
  if (Math.abs(x) < 20 && z < -26 && z > -64) return false;
  if (distSeg(x, z, 12, -12, 31, -24) < 5 || distSeg(x, z, -10, 8, -19, 21) < 5) return false;
  if (Math.hypot(x - 15, z - 36) < 9 || Math.hypot(x + 15, z - 42) < 8 || Math.hypot(x - 26, z - 10) < 7 || Math.hypot(x + 28, z - 50) < 8 || Math.hypot(x - 11, z - 60) < 5 || Math.hypot(x + 10, z - 62) < 5) return false;
  return true;
}
const trees = [];
let tries = 0;
while (trees.length < 85 && tries++ < 4000) { const x = -70 + rand() * 130, z = -56 + rand() * 118; if (clearOf(x, z)) trees.push([x, z, rand()]); }
tries = 0;
while (trees.length < 230 && tries++ < 8000) {
  const x = -140 + rand() * 280, z = -140 + rand() * 280;
  const inside = x > -80 && x < 70 && z > -66 && z < 72; const onRoad = z > 68 && z < 84;
  if (!inside && !onRoad && Math.abs(x) < 145 && Math.abs(z) < 145) trees.push([x, z, rand()]);
}
{
  const trunkGeo = new THREE.CylinderGeometry(0.22, 0.35, 2.2, 7); trunkGeo.translate(0, 1.1, 0);
  const pineGeo = new THREE.ConeGeometry(1.7, 4.5, 8); pineGeo.translate(0, 3.9, 0);
  const roundGeo = new THREE.SphereGeometry(1.9, 10, 8); roundGeo.translate(0, 3.6, 0);
  const pines = trees.filter(t => t[2] < 0.5), rounds = trees.filter(t => t[2] >= 0.5);
  const trunk = new THREE.InstancedMesh(trunkGeo, std(0x6b4a2b), trees.length);
  const pine = new THREE.InstancedMesh(pineGeo, std(0x2f7a3a), pines.length);
  const round = new THREE.InstancedMesh(roundGeo, std(0x4a9a3c), rounds.length);
  const m4 = new THREE.Matrix4(), c = new THREE.Color();
  const place = (im, list) => list.forEach((t, i) => {
    const s = 0.8 + (t[2] * 7919 % 1) * 0.7; m4.makeScale(s, s, s); m4.setPosition(t[0], 0, t[1]);
    im.setMatrixAt(i, m4); c.setHSL(0.25 + (t[2] * 31 % 1) * 0.1, 0.5, 0.3 + (t[2] * 17 % 1) * 0.15); im.setColorAt(i, c);
  });
  trees.forEach((t, i) => { const s = 0.8 + (t[2] * 7919 % 1) * 0.7; m4.makeScale(s, s, s); m4.setPosition(t[0], 0, t[1]); trunk.setMatrixAt(i, m4); });
  place(pine, pines); place(round, rounds);
  for (const im of [trunk, pine, round]) { im.castShadow = true; im.receiveShadow = true; scene.add(im); }
}

// ---------- fence & gate ----------
{
  const fenceMat = std(0xf7f7f7);
  const posts = [];
  function fenceLine(x1, z1, x2, z2) {
    const dx = x2 - x1, dz = z2 - z1, len = Math.hypot(dx, dz), n = Math.round(len / 3);
    for (let i = 0; i <= n; i++) posts.push([x1 + dx * i / n, z1 + dz * i / n]);
    for (const h of [0.45, 0.95]) { const r = add(scene, new THREE.BoxGeometry(0.1, 0.12, len), fenceMat, (x1 + x2) / 2, h, (z1 + z2) / 2); r.rotation.y = Math.atan2(dx, dz); }
  }
  fenceLine(-74, -60, 64, -60); fenceLine(-74, -60, -74, 66); fenceLine(64, -60, 64, 66); fenceLine(-74, 66, -7, 66); fenceLine(7, 66, 64, 66);
  const pg = new THREE.BoxGeometry(0.22, 1.3, 0.22); pg.translate(0, 0.65, 0);
  const im = new THREE.InstancedMesh(pg, fenceMat, posts.length); const m4 = new THREE.Matrix4();
  posts.forEach((p, i) => { m4.makeTranslation(p[0], 0, p[1]); im.setMatrixAt(i, m4); });
  im.castShadow = true; scene.add(im);
  // gate
  const pillarMat = std(0xe9d9b0); const signTex = textTexture('FUN PARK', 1024, 200, '#d7263d', '#fff6d8');
  for (const x of [-7.5, 7.5]) { add(scene, new THREE.BoxGeometry(2, 7.5, 2), pillarMat, x, 3.75, 66); add(scene, new THREE.SphereGeometry(0.7, 12, 8), glowMat(0xffe9a0, 2), x, 8.0, 66); }
  const plain = std(0xd7263d);
  add(scene, new THREE.BoxGeometry(17, 3, 0.6), [plain, plain, plain, plain, new THREE.MeshStandardMaterial({ map: signTex }), new THREE.MeshStandardMaterial({ map: signTex })], 0, 8.2, 66);
  const flagCols = [0xff5252, 0xffd23f, 0x3cd070, 0x3fa9ff, 0xff7ad9];
  for (let i = -2; i <= 2; i++) { add(scene, new THREE.PlaneGeometry(1.2, 0.8), std(flagCols[i + 2], { side: THREE.DoubleSide }), i * 3.4 + 0.6, 10.4, 66); add(scene, new THREE.CylinderGeometry(0.04, 0.04, 1.6), std(0x555555), i * 3.4, 10.5, 66); }
  nightLight(0xffd9a0, 40, 30, 0, 7.5, 66);
  // ticket booth & balloon stand
  const booth = new THREE.Group(); booth.position.set(11, 0, 60); scene.add(booth);
  add(booth, new THREE.BoxGeometry(4, 3, 3), std(0xf4e2b8), 0, 1.5, 0);
  add(booth, new THREE.BoxGeometry(2.4, 1.1, 0.1), glowMat(0xcfe8ff, 1.2), 0, 1.8, 1.55);
  const br = add(booth, new THREE.ConeGeometry(3.3, 1.6, 4), std(0x3b63c4), 0, 3.8, 0); br.rotation.y = Math.PI / 4;
  const stand = new THREE.Group(); stand.position.set(-10, 0, 62); scene.add(stand);
  add(stand, new THREE.BoxGeometry(2.2, 1.2, 1.4), std(0x8a5a2b), 0, 0.6, 0);
  for (let i = 0; i < 9; i++) { const a = i * 0.7, r = 0.5 + (i % 3) * 0.35, y = 3 + (i % 4) * 0.5; add(stand, new THREE.SphereGeometry(0.42, 12, 10), std(flagCols[i % 5], { roughness: 0.3 }), Math.cos(a) * r, y, Math.sin(a) * r); beam(stand, new V3(0, 1.2, 0), new V3(Math.cos(a) * r, y - 0.4, Math.sin(a) * r), 0.015, std(0xdddddd)); }
}

// ---------- buildings ----------
const windowMat = glowMat(0xffe7a0, 1.6);
function building(x, z, w, h, d, rotY, wallMat, roofColor, opts = {}) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rotY; scene.add(g);
  add(g, new THREE.BoxGeometry(w, h, d), wallMat, 0, h / 2, 0);
  const rh = opts.roofH || 2.6;
  const roof = add(g, new THREE.ConeGeometry(1, rh, 4), std(roofColor), 0, h + rh / 2, 0);
  roof.rotation.y = Math.PI / 4; roof.scale.set((w + 1) / Math.SQRT2, 1, (d + 1) / Math.SQRT2);
  add(g, new THREE.BoxGeometry(1.5, 2.3, 0.12), std(0x5a3a1e), 0, 1.15, d / 2 + 0.05);
  const nw = opts.windows || 2;
  for (let i = 0; i < nw; i++) { const wx = (i - (nw - 1) / 2) * (w / (nw + 0.5)); if (Math.abs(wx) < 1.2) continue; add(g, new THREE.BoxGeometry(1.1, 1.1, 0.12), windowMat, wx, 2.0, d / 2 + 0.05); }
  if (opts.awning) { const a = add(g, new THREE.BoxGeometry(w * 0.8, 0.12, 2), new THREE.MeshStandardMaterial({ map: awningTex }), 0, 2.9, d / 2 + 1); a.rotation.x = 0.25; }
  if (opts.sign) { const t = textTexture(opts.sign, 512, 128, opts.signBg || '#2a7bd5', '#fff'); add(g, new THREE.PlaneGeometry(w * 0.7, w * 0.7 / 4), new THREE.MeshStandardMaterial({ map: t }), 0, h - 0.4, d / 2 + 0.07); }
  return g;
}
building(15, 36, 10, 4.5, 7, -0.3, std(0xf6d8a8), 0xc0392b, { awning: true, sign: 'CAFE', windows: 3 });
building(-15, 42, 8, 4, 6, 0.35, std(0xcfe3f6), 0x2c5aa0, { awning: true, sign: 'SHOP', signBg: '#d7263d', windows: 2 });
building(26, 10, 7, 4, 5, -0.8, std(0xf2e2c4), 0x6a8d3a, { sign: 'ICE', signBg: '#e67e22' });
building(-28, 50, 9, 5, 6, 0.1, new THREE.MeshStandardMaterial({ map: brickTex }), 0x7a4b2a, { windows: 3, sign: 'GAMES', signBg: '#8e44ad' });
{ // castle
  const castle = new THREE.Group(); castle.position.set(0, 0, -47); scene.add(castle);
  const wall = new THREE.MeshStandardMaterial({ map: brickTex, roughness: 0.9 }); const roofMat = std(0x3b63c4, { roughness: 0.5 });
  add(castle, new THREE.BoxGeometry(26, 11, 12), wall, 0, 5.5, 0);
  for (let x = -12; x <= 12; x += 2.4) add(castle, new THREE.BoxGeometry(1.2, 1.2, 1.2), wall, x, 11.6, 5.6);
  const towerAt = (x, z, r, h) => {
    add(castle, new THREE.CylinderGeometry(r, r * 1.08, h, 20), wall, x, h / 2, z);
    add(castle, new THREE.ConeGeometry(r * 1.25, r * 1.9, 20), roofMat, x, h + r * 0.95, z);
    add(castle, new THREE.CylinderGeometry(0.05, 0.05, 2.5), std(0x555555), x, h + r * 1.9 + 1.2, z);
    add(castle, new THREE.PlaneGeometry(1.4, 0.9), std(0xffd23f, { side: THREE.DoubleSide }), x + 0.7, h + r * 1.9 + 2, z);
    add(castle, new THREE.SphereGeometry(0.3, 8, 8), glowMat(0xfff0b0, 2.5), x, h + r * 1.9 + 0.1, z);
  };
  towerAt(-13, 6, 2.8, 15); towerAt(13, 6, 2.8, 15); towerAt(-13, -6, 2.8, 15); towerAt(13, -6, 2.8, 15); towerAt(0, -3, 3.8, 23);

// ---------- Roller coaster ----------
const loopC = new V3(-28, 10, -30), loopR = 7;
const P = [[-16, 2.5, 26], [-27, 2.5, 27], [-38, 3, 26], [-48, 6, 22], [-54, 12, 14], [-57, 18, 4], [-57, 22, -6], [-55, 17, -16], [-50, 7, -25], [-42, 3.5, -30]];
for (let k = 0; k <= 8; k++) { const a = (-90 + 45 * k) * Math.PI / 180; P.push([loopC.x + loopR * Math.cos(a), loopC.y + loopR * Math.sin(a), loopC.z + 4 * k / 8]); }
P.push([-18, 4, -24], [-14, 9, -18], [-11, 6, -8], [-11, 3, 2], [-12, 7, 10], [-13, 3.5, 18]);
const curve = new THREE.CatmullRomCurve3(P.map(p => new V3(...p)), true, 'centripetal', 0.5);
curve.arcLengthDivisions = 2000;
const trackLength = curve.getLength();
function newFrame() { return { p: new V3(), T: new V3(), up: new V3(), right: new V3() }; }
function frameAt(u, f) {
  u = ((u % 1) + 1) % 1;
  curve.getPointAt(u, f.p); curve.getTangentAt(u, f.T).normalize();
  const dx = f.p.x - loopC.x, dy = f.p.y - loopC.y;
  if (Math.hypot(dx, dy) < loopR + 2.5 && Math.abs(f.p.z - loopC.z) < 5) f.up.set(-dx, -dy, 0); else f.up.set(0, 1, 0);
  f.up.addScaledVector(f.T, -f.T.dot(f.up));
  if (f.up.lengthSq() < 1e-6) f.up.set(0, 0, 1).addScaledVector(f.T, -f.T.z);
  f.up.normalize(); f.right.crossVectors(f.T, f.up).normalize();
  return f;
}
class OffsetCurve extends THREE.Curve {
  constructor(side, upOff) { super(); this.side = side; this.upOff = upOff; this.f = newFrame(); }
  getPoint(t, target = new V3()) { const f = frameAt(t, this.f); return target.copy(f.p).addScaledVector(f.right, this.side).addScaledVector(f.up, this.upOff); }
}
const railMat = std(0xe8342f, { metalness: 0.4, roughness: 0.4 });
const spineMat = std(0xf4f4f4, { metalness: 0.3, roughness: 0.5 });
const coasterGroup = new THREE.Group(); scene.add(coasterGroup);
for (const s of [-0.55, 0.55]) add(coasterGroup, new THREE.TubeGeometry(new OffsetCurve(s, 0), 900, 0.14, 7, true), railMat);
add(coasterGroup, new THREE.TubeGeometry(new OffsetCurve(0, -0.5), 900, 0.28, 8, true), spineMat);
{
  const fr = newFrame(), m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s1 = new V3(1, 1, 1), pos = new V3(), back = new V3();
  const nTies = Math.round(trackLength / 1.4);
  const ties = new THREE.InstancedMesh(new THREE.BoxGeometry(1.7, 0.12, 0.4), std(0x50505a), nTies);
  for (let i = 0; i < nTies; i++) {
    const f = frameAt(i / nTies, fr); back.copy(f.T).negate(); m4.makeBasis(f.right, f.up, back); q.setFromRotationMatrix(m4);
    pos.copy(f.p).addScaledVector(f.up, -0.22); m4.compose(pos, q, s1); ties.setMatrixAt(i, m4);
  }
  ties.castShadow = true; coasterGroup.add(ties);
  const sup = [];
  const nS = Math.round(trackLength / 3.5);
  for (let i = 0; i < nS; i++) { const f = frameAt(i / nS, fr); if (f.up.y < 0.4) continue; pos.copy(f.p).addScaledVector(f.up, -0.55); if (pos.y < 0.9) continue; sup.push([pos.x, pos.y, pos.z]); }
  sup.push([-21.55, 10, -29], [-34.45, 10, -27]);
  const supGeo = new THREE.CylinderGeometry(1, 1, 1, 8); supGeo.translate(0, 0.5, 0);
  const sups = new THREE.InstancedMesh(supGeo, spineMat, sup.length);
  sup.forEach((p, i) => { m4.compose(new V3(p[0], 0, p[2]), new THREE.Quaternion(), new V3(0.22, p[1], 0.22)); sups.setMatrixAt(i, m4); });
  sups.castShadow = true; sups.receiveShadow = true; coasterGroup.add(sups);
  const nB = Math.round(trackLength / 2.5);
  const bulbs = new THREE.InstancedMesh(new THREE.SphereGeometry(0.17, 6, 5), glowMat(0xfff0a0, 3), nB);
  for (let i = 0; i < nB; i++) { const f = frameAt(i / nB, fr); pos.copy(f.p).addScaledVector(f.up, -0.95); m4.makeTranslation(pos.x, pos.y, pos.z); bulbs.setMatrixAt(i, m4); }
  coasterGroup.add(bulbs);
}

{

const cars = [];
function makeCar(color, first) {
  const g = new THREE.Group();
  add(g, new THREE.BoxGeometry(1.5, 0.6, 2.3), std(color, { roughness: 0.4, metalness: 0.2 }), 0, 0.35, 0);
  for (const z of [-0.6, 0.4]) { add(g, new THREE.BoxGeometry(1.3, 0.5, 0.15), std(0x222222), 0, 0.85, z); add(g, new THREE.BoxGeometry(1.3, 0.15, 0.7), std(0x333333), 0, 0.68, z - 0.4); }
  for (const dx of [-0.8, 0.8]) for (const dz of [-0.8, 0.8]) { const w = add(g, new THREE.CylinderGeometry(0.2, 0.2, 0.15, 10), std(0x222222), dx, 0.1, dz); w.rotation.z = Math.PI / 2; }
  if (first) { for (const dx of [-0.5, 0.5]) add(g, new THREE.SphereGeometry(0.13, 8, 6), glowMat(0xffffff, 3), dx, 0.4, -1.17); add(g, new THREE.ConeGeometry(0.4, 0.8, 4), std(color, { roughness: 0.4 }), 0, 0.35, -1.5).rotation.x = -Math.PI / 2; }
  else add(g, new THREE.SphereGeometry(0.1, 8, 6), glowMat(0xff3030, 3), 0, 0.4, 1.17);
  return g;
}
for (let i = 0; i < 5; i++) { const c = makeCar(i === 0 ? 0xe8342f : (i % 2 ? 0xf1c40f : 0x3498db), i === 0); scene.add(c); cars.push(c); }
const carGap = 2.6;
function uOfPoint(p) { let best = 0, bd = 1e9; const v = new V3(); for (let i = 0; i < 2000; i++) { curve.getPointAt(i / 2000, v); const d = v.distanceTo(p); if (d < bd) { bd = d; best = i / 2000; } } return best; }
const uLift0 = uOfPoint(new V3(-38, 3, 26)), uLift1 = uOfPoint(new V3(-57, 22, -6));
let progress = 0.02;
const carFrame = newFrame(), carM = new THREE.Matrix4(), carBack = new V3();
function updateCoaster(dt) {
  const f = frameAt(progress, carFrame);
  let v = (progress > uLift0 && progress < uLift1) ? 4.5 : 2.5 + 0.85 * Math.sqrt(Math.max(0, 2 * 9.8 * (23.5 - f.p.y)));
  progress = (progress + v * dt / trackLength) % 1;
  for (let i = 0; i < cars.length; i++) {
    const u = ((progress - i * carGap / trackLength) % 1 + 1) % 1;
    const fc = frameAt(u, carFrame);
    cars[i].position.copy(fc.p).addScaledVector(fc.up, 0.3);
    carBack.copy(fc.T).negate(); carM.makeBasis(fc.right, fc.up, carBack); cars[i].quaternion.setFromRotationMatrix(carM);
  }
}

// ---------- day / night ----------
const btn = document.getElementById('toggle');
let night = false;
const DAY = { top: 0x2f72d6, bot: 0xcfe5ff, fog: 0xcfe5ff, hemi: [0xbfdfff, 0x56733d, 0.9], amb: 0.15, sun: [0xfff1d6, 2.6, [70, 100, 40]], exp: 1.0 };
const NIGHT = { top: 0x03051a, bot: 0x161c48, fog: 0x10152e, hemi: [0x2b3a6b, 0x0c0c16, 0.22], amb: 0.06, sun: [0x93a8ff, 0.3, [-60, 80, -30]], exp: 0.8 };
function applyNight(v) {
  night = !!v; const S = night ? NIGHT : DAY;
  setSky(S.top, S.bot); scene.fog.color.set(S.fog);
  hemi.color.set(S.hemi[0]); hemi.groundColor.set(S.hemi[1]); hemi.intensity = S.hemi[2]; ambient.intensity = S.amb;
  sun.color.set(S.sun[0]); sun.intensity = S.sun[1]; sun.position.set(...S.sun[2]);
  renderer.toneMappingExposure = S.exp;
  stars.material.opacity = night ? 1 : 0; sunMesh.visible = !night; moonMesh.visible = night;
  for (const l of nightLights) l.intensity = night ? l.userData.n : 0;
  for (const m of emissiveMats) m.emissiveIntensity = night ? m.userData.n : 0;
  btn.textContent = night ? '☀ 昼にする' : '🌙 夜にする';
}
btn.addEventListener('click', () => applyNight(!night));
applyNight(false);

// ---------- animation ----------
const clock = new THREE.Clock();
let wheelAngle = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); const t = clock.elapsedTime;
  wheelAngle += dt * 0.18; wheel.rotation.z = wheelAngle;
  for (const g of gondolas) g.rotation.z = -wheelAngle;
  carousel.rotation.y += dt * 0.5;
  for (const h of horses) h.position.y = 0.3 + 0.35 * (0.5 + 0.5 * Math.sin(t * 2.5 + h.userData.phase));
  updateCoaster(dt);
  if (night) { const k = Math.floor(t * 4) % 6; bulbMats.forEach((m, i) => m.emissiveIntensity = (i === k || i === (k + 3) % 6) ? 3.5 : 0.6); }
  controls.update();
  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

// ---------- inspection API ----------
window.park = {
  scene, camera, renderer, wheel, gondolas,
  coasterCurve: curve, coasterCar: cars[0],
  getCoasterProgress: () => progress,
  carousel,
  setNight: (v) => applyNight(!!v),
  isNight: () => night
};
