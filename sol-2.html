<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUMINA PARK — 小さな光の遊園地</title>
<style>
  :root { color-scheme:light; --ink:#243e42; --paper:rgba(255,253,241,.88); --line:rgba(42,70,70,.17); }

  .top-controls { position:absolute; right:32px; top:32px; display:flex; gap:9px; pointer-events:auto; }
  button { border:1px solid var(--line); color:var(--ink); background:var(--paper); padding:13px 19px; border-radius:30px; cursor:pointer; font:600 12px system-ui,sans-serif; letter-spacing:.05em; backdrop-filter:blur(16px); box-shadow:0 4px 20px #132f3410; transition:background .2s,transform .2s; }
  button:hover { background:#fffbed; transform:translateY(-2px); }
  button:focus-visible { outline:3px solid #e7a655; outline-offset:3px; }
  #nightIcon { display:inline-block; width:19px; font-size:16px; vertical-align:-1px; margin-right:5px; }
  .bottom { position:absolute; bottom:28px; left:38px; right:38px; display:flex; justify-content:space-between; align-items:flex-end; gap:20px; }
  .guide { border-top:1px solid var(--line); padding-top:13px; display:flex; gap:25px; }
  .guide-item { font-size:10px; letter-spacing:.12em; }
  .guide-item b { font-family:Georgia,serif; font-size:16px; font-weight:normal; margin-right:7px; color:#b36a43; }
  .hint { text-align:right; font-size:10px; line-height:1.9; letter-spacing:.09em; opacity:.65; }
  .status { display:inline-flex; align-items:center; gap:7px; padding:7px 11px; margin-bottom:10px; border:1px solid var(--line); border-radius:20px; font-size:9px; letter-spacing:.15em; }
  .dot { width:5px; height:5px; background:#50968b; border-radius:50%; }
  body.night { --ink:#ebeedb; --paper:rgba(20,37,54,.85); --line:rgba(205,229,228,.22); }
  body.night button:hover { background:#294452; }
  body.night .guide-item b { color:#f6bc71; }
  body.night .dot { background:#f7c97d; box-shadow:0 0 10px #f7c97d; }
  @media(max-width:700px) {
    header { top:22px; left:22px; }
    h1 { font-size:35px; }
    .eyebrow { font-size:8px; }
    .subtitle { font-size:9px; }
    .top-controls { right:16px; top:20px; flex-direction:column; gap:7px; }
    button { padding:10px 13px; font-size:10px; }
    .bottom { left:22px; right:22px; bottom:20px; }
    .guide { gap:12px; }

    .guide-item b { display:block; margin-bottom:4px; }
    .hint { font-size:8px; }
    .status { display:none; }
  }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<div id="hud">
  <header>
    <div class="eyebrow">A LITTLE WORLD OF WONDER</div>

    <div class="subtitle">小さな光の遊園地</div>
  </header>
  <div class="top-controls">
    <button id="nightButton" type="button" aria-pressed="false"><span id="nightIcon">☾</span><span id="nightText">夜のパークへ</span></button>

  </div>

        <div class="guide-item"><b>02</b>COMET RUN</div>

      </div>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const TAU = Math.PI * 2;
const V = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,650);
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
const homePosition = V(58,44,63);
const homeTarget = V(0,3.7,0);
camera.position.copy(homePosition);
controls.target.copy(homeTarget);
controls.enableDamping = true;
controls.dampingFactor = .065;
controls.minDistance = 38;
controls.maxDistance = 155;
controls.maxPolarAngle = Math.PI*.478;
controls.update();

document.querySelector('#resetButton').onclick = () => {
  camera.position.copy(homePosition);
  controls.target.copy(homeTarget);
  controls.update();
};

let seed = 71;
function rand() {
  seed = (seed*1664525+1013904223)>>>0;
  return seed/4294967296;
}

const materials = {};
function mat(name,color,roughness=.7,metalness=0) {
  return materials[name] = new THREE.MeshStandardMaterial({color,roughness,metalness});
}
const M = {
  cream:mat('cream',0xffedcb),
  white:mat('white',0xfffaf0),
  teal:mat('teal',0x217e83,.47,.22),
  navy:mat('navy',0x254752,.5,.25),
  coral:mat('coral',0xe97762,.55,.12),
  yellow:mat('yellow',0xf5bd57),
  gold:mat('gold',0xdba85a,.36,.55),
  wood:mat('wood',0xb87748),
  path:mat('path',0xe8d5ac),
  pathEdge:mat('pathEdge',0xf5e9cf),
  grass:mat('grass',0x89b990),
  mint:mat('mint',0x74b6a0),
  leaf:mat('leaf',0x3f8c70),
  leaf2:mat('leaf2',0x6aa479),
  darkLeaf:mat('darkLeaf',0x347263),
  lilac:mat('lilac',0xb39bcb),
  dark:mat('dark',0x293b43),
  water:mat('water',0x51b9cb,.22,.25)
};
const lampMaterial = new THREE.MeshStandardMaterial({
  color:0xffdf97,emissive:0xffb957,emissiveIntensity:.25,roughness:.35
});
const pinkLightMaterial = new THREE.MeshStandardMaterial({
  color:0xffc8b5,emissive:0xff805d,emissiveIntensity:.18,roughness:.35
});
const aquaLightMaterial = new THREE.MeshStandardMaterial({
  color:0x9fe3db,emissive:0x39cfdb,emissiveIntensity:.2,roughness:.35
});
const bulbMaterials = [lampMaterial,pinkLightMaterial,aquaLightMaterial];

const unitBox = new THREE.BoxGeometry(1,1,1);
const unitCylinder = new THREE.CylinderGeometry(1,1,1,12);
const unitSphere = new THREE.SphereGeometry(1,12,8);
const leafGeometry = new THREE.IcosahedronGeometry(1,1);

function mesh(parent,geometry,material,x=0,y=0,z=0) {
  const m = new THREE.Mesh(geometry,material);
  m.position.set(x,y,z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function box(parent,w,h,d,material,x=0,y=0,z=0) {
  const m = mesh(parent,unitBox,material,x,y,z);
  m.scale.set(w,h,d);
  return m;
}
function sphere(parent,r,material,x=0,y=0,z=0,sx=1,sy=1,sz=1) {
  const m = mesh(parent,unitSphere,material,x,y,z);
  m.scale.set(r*sx,r*sy,r*sz);
  return m;
}
function cylinder(parent,r,h,material,x=0,y=0,z=0) {
  const m = mesh(parent,unitCylinder,material,x,y,z);
  m.scale.set(r,h,r);
  return m;
}
function rod(parent,a,b,r,material) {
  const delta = b.clone().sub(a);
  const m = cylinder(parent,r,delta.length(),material);
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(V(0,1,0),delta.normalize());
  return m;
}
function torus(parent,r,tube,material,x,y,z,horizontal=false,segments=96) {
  const m = mesh(parent,new THREE.TorusGeometry(r,tube,8,segments),material,x,y,z);
  if(horizontal) m.rotation.x = Math.PI/2;
  return m;
}
function group(parent,x=0,y=0,z=0) {
  const g = new THREE.Group();
  g.position.set(x,y,z);
  parent.add(g);
  return g;
}
function roundedShape(w,d,r) {
  const s = new THREE.Shape(),x=-w/2,y=-d/2;
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y);
  s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+d-r);
  s.quadraticCurveTo(x+w,y+d,x+w-r,y+d);
  s.lineTo(x+r,y+d);
  s.quadraticCurveTo(x,y+d,x,y+d-r);
  s.lineTo(x,y+r);
  s.quadraticCurveTo(x,y,x+r,y);
  return s;
}
function slab(parent,w,d,h,r,material,x=0,y=0,z=0,bevel=.06) {
  const geo = new THREE.ExtrudeGeometry(roundedShape(w,d,r),{
    depth:h,
    bevelEnabled:bevel>0,
    bevelThickness:bevel,
    bevelSize:bevel,
    bevelSegments:2,
    steps:1,
    curveSegments:8
  });
  geo.rotateX(-Math.PI/2);
  return mesh(parent,geo,material,x,y,z);
}
function textTexture(text,sub='',bg='#254752',fg='#fff0ce') {
  const c = document.createElement('canvas');
  c.width=1024;
  c.height=256;
  const ctx = c.getContext('2d');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,1024,256);
  ctx.strokeStyle=fg;
  ctx.lineWidth=3;
  ctx.strokeRect(14,14,996,228);
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillStyle=fg;
  ctx.font='bold 78px Georgia, serif';
  ctx.fillText(text,512,sub?105:133,940);
  if(sub) {
    ctx.font='25px sans-serif';
    ctx.fillText(sub,512,191,920);
  }
  const texture = new THREE.CanvasTexture(c);
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),8);
  return texture;
}
const signMaterials = [];
function sign(parent,text,sub,w,h,x,y,z,bg,fg) {
  const tex = textTexture(text,sub,bg,fg);
  const material = new THREE.MeshStandardMaterial({
    map:tex,
    roughness:.7,
    emissive:0xffffff,
    emissiveMap:tex,
    emissiveIntensity:.08
  });
  signMaterials.push(material);
  return mesh(parent,new THREE.PlaneGeometry(w,h),material,x,y,z);
}
function diskShadow(parent,r,x,z,opacity=.10) {
  const m = new THREE.Mesh(
    new THREE.CircleGeometry(r,32),
    new THREE.MeshBasicMaterial({color:0x173d36,transparent:true,opacity,depthWrite:false})
  );
  m.rotation.x=-Math.PI/2;
  m.position.set(x,.115,z);
  parent.add(m);
}

// 空と照明
const skyUniforms = {
  top:{value:new THREE.Color(0x82bfc9)},
  horizon:{value:new THREE.Color(0xe1e7d3)}
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(320,32,20),
  new THREE.ShaderMaterial({
    side:THREE.BackSide,
    depthWrite:false,
    uniforms:skyUniforms,
    vertexShader:`
      varying vec3 vWorld;
      void main() {
        vWorld=(modelMatrix*vec4(position,1.0)).xyz;
        gl_Position=projectionMatrix*viewMatrix*vec4(vWorld,1.0);
      }
    `,
    fragmentShader:`
      uniform vec3 top;
      uniform vec3 horizon;
      varying vec3 vWorld;
      void main() {
        float h=normalize(vWorld).y;
        gl_FragColor=vec4(mix(horizon,top,smoothstep(0.0,.65,h)),1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `
  })
);
scene.add(sky);
scene.fog = new THREE.Fog(0xd4e0d0,110,240);

const groundMat = mat('backdrop',0xb9cec1);
const ground = mesh(scene,new THREE.PlaneGeometry(1800,1800),groundMat,0,-1.87,0);
ground.rotation.x=-Math.PI/2;
ground.castShadow=false;

const hemisphere = new THREE.HemisphereLight(0xd7f0ff,0xb8a076,2.1);
scene.add(hemisphere);
const sunLight = new THREE.DirectionalLight(0xffeed4,3.1);
sunLight.position.set(-32,55,38);
sunLight.castShadow=true;
sunLight.shadow.mapSize.set(2048,2048);
Object.assign(sunLight.shadow.camera,{
  left:-48,right:48,top:43,bottom:-43,near:1,far:150
});
sunLight.shadow.bias=-.0003;
sunLight.shadow.normalBias=.035;
scene.add(sunLight);
const fillLight = new THREE.DirectionalLight(0xa9cddd,.55);
fillLight.position.set(30,24,-30);
scene.add(fillLight);

const sun = mesh(
  scene,new THREE.SphereGeometry(5,24,16),
  new THREE.MeshBasicMaterial({color:0xffecc2}),-85,88,-125
);
sun.castShadow=false;
const moon = mesh(
  scene,new THREE.SphereGeometry(3.2,24,16),
  new THREE.MeshBasicMaterial({color:0xe4eff2}),65,72,-125
);
moon.castShadow=false;

const starPositions = [];
for(let i=0;i<450;i++) {
  const a=rand()*TAU,h=.12+rand()*.85,rr=Math.sqrt(1-h*h),r=240;
  starPositions.push(Math.cos(a)*rr*r,h*r,Math.sin(a)*rr*r);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPositions,3));
const stars = new THREE.Points(starGeo,new THREE.PointsMaterial({
  color:0xd9f1ff,size:.48,sizeAttenuation:true,transparent:true,opacity:.9,depthWrite:false
}));
scene.add(stars);

const clouds = group(scene);
const cloudMat = new THREE.MeshStandardMaterial({
  color:0xfff8e8,roughness:1,flatShading:true
});
[[-45,30,-55],[0,36,-85],[43,29,-55],[-70,40,5]].forEach(([x,y,z])=>{
  const g=group(clouds,x,y,z);
  for(let i=0;i<5;i++) {
    const m=sphere(g,2.4+rand()*1.6,cloudMat,(i-2)*2.6,rand()*1.2,rand()*1.5,1.4,.65,1);
    m.castShadow=false;
  }
});

// 厚みのある箱庭の台座
slab(scene,68,50,1.35,3.3,M.cream,0,-1.5,0,.22);
slab(scene,68.05,50.05,.14,3.3,M.gold,0,-.34,0,.05);
slab(scene,67.8,49.8,.25,3.2,M.grass,0,-.23,0,.08);
sign(scene,'L U M I N A   P A R K','',12,.62,0,-.88,25.16,'#e9d3a8','#4a6e66');

const grassCanvas = document.createElement('canvas');
grassCanvas.width=grassCanvas.height=256;
const gc = grassCanvas.getContext('2d');
gc.fillStyle='#a4c397';
gc.fillRect(0,0,256,256);
for(let i=0;i<6500;i++) {
  gc.fillStyle=rand()>.5?'rgba(34,95,62,.045)':'rgba(255,248,190,.10)';
  gc.fillRect(rand()*256,rand()*256,1+rand()*3,1+rand()*3);
}
const grassTexture = new THREE.CanvasTexture(grassCanvas);
grassTexture.colorSpace=THREE.SRGBColorSpace;
grassTexture.wrapS=grassTexture.wrapT=THREE.RepeatWrapping;
grassTexture.repeat.set(12,9);
M.grass.map=grassTexture;
M.grass.needsUpdate=true;

function ribbon(points,width,material,y=.14) {
  const curve=new THREE.CatmullRomCurve3(points.map(p=>V(p[0],y,p[1])));
  const n=100,pos=[],idx=[];
  for(let i=0;i<=n;i++) {
    const p=curve.getPoint(i/n),t=curve.getTangent(i/n);
    const right=V(-t.z,0,t.x).normalize().multiplyScalar(width/2);
    pos.push(p.x+right.x,y,p.z+right.z,p.x-right.x,y,p.z-right.z);
    if(i<n) {
      const k=i*2;
      idx.push(k,k+2,k+1,k+1,k+2,k+3);
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const m=mesh(scene,geo,material);
  m.castShadow=false;
  return m;
}
function path(points,w=3) {
  ribbon(points,w+.35,M.pathEdge,.123);
  ribbon(points,w,M.path,.139);
}
path([[0,23],[0,17],[0,11],[-1,4],[-6,-2],[-16,-6]],3.5);
path([[-1,9],[-7,11],[-12,13],[-18,13],[-25,12]],3);
path([[0,15],[6,15],[13,16],[21,16],[27,18]],3);
path([[-4,2],[-10,1],[-18,0],[-26,2]],2.4);
cylinder(scene,5,.12,M.pathEdge,-1,.12,6);
cylinder(scene,4.7,.13,M.path,-1,.14,6);
torus(scene,4.45,.045,M.cream,-1,.225,6,true);

// 観覧車
const wheelBase = group(scene,-18,0,-10);
cylinder(wheelBase,6.7,.22,M.pathEdge,0,.14,0);
cylinder(wheelBase,6.3,.12,M.path,0,.3,0);
const wheelCenter=11.4,wheelRadius=8.5;
for(const z of [-1.8,1.8]) {
  for(const side of [-1,1]) {
    cylinder(wheelBase,.55,.22,M.gold,side*4.6,.48,z);
    rod(wheelBase,V(side*4.6,.55,z),V(0,wheelCenter,z*.43),.28,M.cream);
    rod(wheelBase,V(side*4.6,.55,z),V(side*3.6,3.2,z*.85),.12,M.teal);
  }
  rod(wheelBase,V(-4.2,1.4,z),V(4.2,1.4,z),.13,M.teal);
}
const axle = cylinder(wheelBase,.45,4.7,M.gold,0,wheelCenter,0);
axle.rotation.x=Math.PI/2;

const wheel = group(wheelBase,0,wheelCenter,0);
torus(wheel,wheelRadius,.17,M.cream,0,0,-.55);
torus(wheel,wheelRadius,.17,M.coral,0,0,.55);
torus(wheel,wheelRadius-.48,.065,M.gold,0,0,.56);
torus(wheel,1.02,.12,M.gold,0,0,.66);
const hub = cylinder(wheel,.78,1.6,M.teal);
hub.rotation.x=Math.PI/2;
sphere(wheel,.52,M.gold,0,0,.95,1,1,.45);

const gondolas = [];
const cabinColors = [M.coral,M.mint,M.yellow,M.lilac];
for(let i=0;i<12;i++) {
  const a=i*TAU/12,x=Math.cos(a)*wheelRadius,y=Math.sin(a)*wheelRadius;
  for(const z of [-.55,.55]) {
    rod(wheel,V(0,0,z),V(x,y,z),.075,i%2?M.gold:M.cream);
  }
  rod(wheel,V(x,y,-.65),V(x,y,.65),.12,M.teal);
  const g=group(wheel,x,y,0);
  gondolas.push(g);
  rod(g,V(0,0,0),V(0,-.62,0),.065,M.gold);
  slab(g,1.62,1.32,.58,.24,cabinColors[i%4],0,-1.63,0,.07);
  slab(g,1.79,1.48,.15,.28,M.cream,0,-.64,0,.04);
  for(const xx of [-.64,.64]) {
    for(const zz of [-.49,.49]) {
      rod(g,V(xx,-1.15,zz),V(xx,-.58,zz),.045,M.gold);
    }
  }
  box(g,1.4,.10,1.18,M.gold,0,-1.06,0);
  box(g,1.1,.25,.3,M.navy,0,-1.14,-.23);
  sphere(g,.12,lampMaterial,0,-.48,.68);
}
const wheelBulbGeo = new THREE.SphereGeometry(.105,8,6);
for(const z of [-.61,.65]) {
  const bulbs=new THREE.InstancedMesh(wheelBulbGeo,lampMaterial,72);
  const matrix=new THREE.Matrix4();
  for(let i=0;i<72;i++) {
    const a=i*TAU/72;
    matrix.makeTranslation(Math.cos(a)*wheelRadius,Math.sin(a)*wheelRadius,z);
    bulbs.setMatrixAt(i,matrix);
  }
  wheel.add(bulbs);
}
sign(wheelBase,'SKY BLOOM','01  /  TAKE THE SCENIC ROUTE',6.3,1.55,0,1.62,4.9);
for(const x of [-3.25,3.25]) {
  cylinder(wheelBase,.075,2.3,M.gold,x,1.25,4.86);
}

// 閉じたコースター：縦ループと、丘・カーブで構成した帰路
class VerticalLoop extends THREE.Curve {
  constructor() {
    super();
    this.arcLengthDivisions=600;
  }
  getPoint(t,target=new THREE.Vector3()) {
    const a=TAU*t;
    return target.set(
      17+7.7*Math.sin(a),
      2.8+7.7*(1-Math.cos(a)),
      -15+4*(t-Math.sin(a)/TAU)
    );
  }
}
const coasterCurve = new THREE.CurvePath();
coasterCurve.add(new VerticalLoop());
function bezier(a,b,c,d) {
  coasterCurve.add(new THREE.CubicBezierCurve3(V(...a),V(...b),V(...c),V(...d)));
}
bezier([17,2.8,-11],[25,2.8,-11],[30,3,-10],[29,4,-2]);

// 平行移動フレーム：ループの頂点では車体の上方向も下を向く。
const frameCount=1600;
const frameTangents=[],frameUps=[],frameQuaternions=[];
let previousTangent=coasterCurve.getTangentAt(0).normalize();
let currentUp=V(0,1,0).addScaledVector(previousTangent,-previousTangent.y).normalize();
const transport=new THREE.Quaternion();
for(let i=0;i<=frameCount;i++) {
  const t=coasterCurve.getTangentAt(i/frameCount).normalize();
  if(i>0) {
    currentUp.applyQuaternion(transport.setFromUnitVectors(previousTangent,t));
  }
  currentUp.addScaledVector(t,-currentUp.dot(t)).normalize();
  frameTangents.push(t.clone());
  frameUps.push(currentUp.clone());
  previousTangent=t;
}
const closureAngle=Math.atan2(
  frameTangents[0].dot(new THREE.Vector3().crossVectors(frameUps[frameCount],frameUps[0])),
  frameUps[frameCount].dot(frameUps[0])
);
const basis=new THREE.Matrix4();
for(let i=0;i<=frameCount;i++) {
  const t=frameTangents[i],up=frameUps[i];
  up.applyAxisAngle(t,closureAngle*i/frameCount);
  const right=new THREE.Vector3().crossVectors(up,t).normalize();
  up.crossVectors(t,right).normalize();
  basis.makeBasis(right,up,t);
  frameQuaternions.push(new THREE.Quaternion().setFromRotationMatrix(basis));
}
function frameAt(u) {
  u=((u%1)+1)%1;
  const f=u*frameCount,i=Math.floor(f);
  const q=frameQuaternions[i].clone().slerp(frameQuaternions[i+1],f-i);
  return {
    q,
    up:V(0,1,0).applyQuaternion(q),
    right:V(1,0,0).applyQuaternion(q)
  };
}
class RailCurve extends THREE.Curve {
  constructor(offset,height) {
    super();
    this.offset=offset;
    this.height=height;
  }
  getPoint(t,target=new THREE.Vector3()) {
    const f=frameAt(t);
    return coasterCurve.getPointAt(t,target)
      .addScaledVector(f.right,this.offset)
      .addScaledVector(f.up,this.height);
  }
}

// 街灯と、夜に現れる柔らかな光
const glowCanvas=document.createElement('canvas');
glowCanvas.width=glowCanvas.height=128;
const glowCtx=glowCanvas.getContext('2d');
const grad=glowCtx.createRadialGradient(64,64,0,64,64,64);
grad.addColorStop(0,'rgba(255,227,160,1)');
grad.addColorStop(.15,'rgba(255,209,126,.55)');
grad.addColorStop(.45,'rgba(255,186,100,.12)');
grad.addColorStop(1,'rgba(255,175,80,0)');
glowCtx.fillStyle=grad;
glowCtx.fillRect(0,0,128,128);
const glowTexture=new THREE.CanvasTexture(glowCanvas);
const glowMaterial=new THREE.SpriteMaterial({
  map:glowTexture,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false
});
const nightGlows=[],nightLights=[];
function glow(parent,x,y,z,size=2) {
  const s=new THREE.Sprite(glowMaterial);
  s.position.set(x,y,z);
  s.scale.set(size,size,1);
  parent.add(s);
  nightGlows.push(s);
  return s;
}

  sphere(g,.25,lampMaterial,0,3.66,0,1,1.25,1);
  cylinder(g,.33,.11,M.teal,0,3.97,0);

  nightLights.push({light,intensity});
}

// 昼夜モード
let night=false;
function setNight(value) {
  night=Boolean(value);
  document.body.classList.toggle('night',night);
  document.querySelector('#nightButton').setAttribute('aria-pressed',String(night));
  document.querySelector('#nightIcon').textContent=night?'☀':'☾';
  document.querySelector('#nightText').textContent=night?'昼のパークへ':'夜のパークへ';
  document.querySelector('#statusText').textContent=night
    ?'NIGHT LIGHTS · ALL RIDES OPEN'
    :'DAYTIME · ALL RIDES OPEN';

  skyUniforms.top.value.set(night?0x071426:0x82bfc9);
  skyUniforms.horizon.value.set(night?0x263d52:0xe1e7d3);
  scene.fog.color.set(night?0x1a3044:0xd4e0d0);
  groundMat.color.set(night?0x243e4b:0xb9cec1);
  hemisphere.color.set(night?0x829fc6:0xd7f0ff);
  hemisphere.groundColor.set(night?0x34434d:0xb8a076);
  hemisphere.intensity=night?.58:2.1;
  sunLight.color.set(night?0x9abfff:0xffeed4);
  sunLight.intensity=night?.42:3.1;
  fillLight.intensity=night?.25:.55;
  renderer.toneMappingExposure=night?1.13:1.08;

  bulbMaterials.forEach(m=>m.emissiveIntensity=night?4:.22);
  signMaterials.forEach(m=>m.emissiveIntensity=night?.7:.08);
  M.water.emissive.set(night?0x166679:0x000000);
  M.water.emissiveIntensity=night?.6:0;
  jetMat.emissiveIntensity=night?.8:.12;
  nightLights.forEach(({light,intensity})=>light.intensity=night?intensity:0);
  nightGlows.forEach(g=>g.visible=night);
  stars.visible=night;
  moon.visible=night;
  sun.visible=!night;
  clouds.visible=!night;
}
document.querySelector('#nightButton').onclick=()=>setNight(!night);
setNight(false);

// 描画フレーム数に依存させず、実際に経過した時間から全ての位置を求める。
// 低フレームレートでも経過時間を切り捨てず、観覧車の回転速度を維持する。
const animationStart=performance.now();
const wheelAngularSpeed=.12;
const carouselAngularSpeed=.27;
const coasterSpeed=8.3;

function animate(now) {
  requestAnimationFrame(animate);
  const elapsed=Math.max(0,(now-animationStart)/1000);

  const wheelAngle=elapsed*wheelAngularSpeed;
  wheel.rotation.z=wheelAngle;
  for(const gondola of gondolas) {
    gondola.rotation.z=-wheelAngle;
  }

  coasterProgress=(initialCoasterProgress+elapsed*coasterSpeed/trackLength)%1;
  updateTrain();

  carousel.rotation.y=-elapsed*carouselAngularSpeed;
  horses.forEach((horse,i)=>{
    horse.position.y=1.75+Math.sin(elapsed*1.9+i*TAU/8)*.25;
  });

  for(let i=0;i<dropCount;i++) {
    const curve=jetCurves[i%jetCurves.length];
    const u=(elapsed*.58+Math.floor(i/8)/6)%1;
    const p=curve.getPoint(u);
    dropMatrix.compose(p,identityQuaternion,V(1,1.5,1));
    drops.setMatrixAt(i,dropMatrix);
  }
  drops.instanceMatrix.needsUpdate=true;

  balloons.rotation.z=Math.sin(elapsed*.65)*.025;
  clouds.position.x=Math.sin(elapsed*.025)*2;
  controls.update();
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);
