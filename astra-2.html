<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<style>
  :root {
    color-scheme: light;
    --ink: #21494f;
    --muted: #617d7d;
    --glass: rgba(255, 253, 240, .79);
    --border: rgba(255, 255, 255, .65);
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body {
    background: #bfd9de;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif;
    color: var(--ink);
  }
  body.night {
    color-scheme: dark;
    --ink: #f4eaca;
    --muted: #b0c9ce;
    --glass: rgba(16, 39, 55, .81);
    --border: rgba(169, 206, 219, .19);

  canvas#world { display: block; width: 100%; height: 100%; outline: none; }
  .interface { position: fixed; inset: 0; pointer-events: none; }
  .brand { position: absolute; top: 34px; left: 40px; }
  .eyebrow {
    font-size: 10px; font-weight: 750; letter-spacing: .24em;
    display: flex; align-items: center; gap: 9px; margin-bottom: 9px;
  }
  .eyebrow::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: #e98668; box-shadow: 0 0 0 4px rgba(233, 134, 104, .12);
  }
  h1 { margin: 0; font-size: 43px; line-height: 1; font-weight: 850; letter-spacing: -.045em; }
  h1 span { color: #e08063; }
  .subtitle { margin-top: 12px; font-size: 12px; letter-spacing: .12em; color: var(--muted); }
  .actions {
    position: absolute; top: 35px; right: 38px;
    display: flex; gap: 9px; align-items: center;
  }
  button {
    pointer-events: auto; cursor: pointer; border: 1px solid var(--border);
    background: var(--glass); color: var(--ink); backdrop-filter: blur(14px);
    box-shadow: 0 5px 22px rgba(23, 53, 65, .07);
    font: inherit; height: 45px; border-radius: 24px;
    transition: background .25s, transform .2s, color .25s;
  }
  button:hover { transform: translateY(-2px); }
  button:focus-visible { outline: 3px solid #e6ab64; outline-offset: 4px; }
  #nightButton {
    display: flex; align-items: center; gap: 10px;
    padding: 0 20px; font-size: 12px; font-weight: 700;
  }
  #modeIcon { font-size: 21px; line-height: 1; }
  #resetButton { width: 45px; font-size: 21px; }
  .legend {
    position: absolute; left: 40px; bottom: 34px;
    background: var(--glass); border: 1px solid var(--border);
    backdrop-filter: blur(14px); border-radius: 16px; padding: 18px 23px;
    box-shadow: 0 8px 30px rgba(23, 53, 65, .06);
  }
  .legend-title {
    font-size: 9px; letter-spacing: .22em; font-weight: 800;
    color: var(--muted); margin-bottom: 13px;
  }
  .legend-row { display: flex; gap: 25px; }
  .attraction { display: flex; align-items: center; gap: 9px; }

  .attraction b { display: block; font-size: 10px; letter-spacing: .07em; }
  .attraction small { display: block; font-size: 10px; margin-top: 3px; color: var(--muted); }
  .hint {
    position: absolute; bottom: 38px; left: 50%; transform: translateX(-50%);
    text-align: center; color: var(--muted); font-size: 10px; line-height: 1.9;
    letter-spacing: .06em; white-space: nowrap;
  }
  .hint b { color: var(--ink); font-size: 9px; letter-spacing: .19em; }
  .status { position: absolute; right: 39px; bottom: 40px; text-align: right; }
  .status b { font-size: 10px; letter-spacing: .13em; font-weight: 650; }
  .status b::before {
    content: ""; display: inline-block; width: 5px; height: 5px;
    margin-right: 7px; background: #66b89c; border-radius: 50%;
  }
  .status small {
    display: block; color: var(--muted); font-size: 9px;
    letter-spacing: .12em; margin-top: 7px;
  }
  @media (max-width: 900px) {
    .brand { left: 22px; top: 24px; }
    h1 { font-size: 32px; }
    .actions { top: 24px; right: 20px; }
    .legend { left: 20px; bottom: 22px; padding: 13px 16px; }
    .legend-row { gap: 14px; }
    .hint {
      left: auto; right: 22px; bottom: 24px;
      transform: none; text-align: right;
    }
    .status { display: none; }
  }
  @media (max-width: 580px) {
    .subtitle, .eyebrow { display: none; }
    h1 { font-size: 28px; }
    #nightButton { padding: 0 13px; }
    .legend { bottom: 55px; }
    .hint { bottom: 12px; }
  }
</style>

<body>
<canvas id="world" aria-label="マウスで回転・ズームできる3Dの遊園地"></canvas>
<div class="interface">
  <header class="brand">
    <div class="eyebrow">A LITTLE WORLD OF WONDER</div>

      </div>
      <div class="attraction">

  <div class="status"><b>ALL RIDES RUNNING</b><small id="timeLabel">DAYLIGHT / 14:30</small></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const TAU = Math.PI * 2;
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#bfd9de');
scene.fog = new THREE.Fog('#bfd9de', 155, 330);

const renderer = new THREE.WebGLRenderer({
  canvas: document.querySelector('#world'),
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const camera = new THREE.OrthographicCamera(-80, 80, 44, -44, .1, 450);
camera.position.set(94, 78, 112);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5, 0);
controls.enableDamping = true;
controls.dampingFactor = .065;
controls.minPolarAngle = .18;
controls.maxPolarAngle = Math.PI / 2 - .08;
controls.minZoom = .65;
controls.maxZoom = 2.7;
controls.enablePan = true;
controls.screenSpacePanning = false;
controls.update();
controls.saveState();
document.querySelector('#resetButton').addEventListener('click', () => controls.reset());

function resize() {
  const aspect = innerWidth / innerHeight;
  const halfHeight = Math.max(44, 64 / aspect);
  camera.left = -halfHeight * aspect;
  camera.right = halfHeight * aspect;
  camera.top = halfHeight;
  camera.bottom = -halfHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);
resize();

const hemi = new THREE.HemisphereLight('#e4f7ff', '#a2a477', 2.25);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff0d5', 3.0);
sun.position.set(-38, 72, 43);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {
  left: -67, right: 67, top: 60, bottom: -60, near: 1, far: 170
});
sun.shadow.normalBias = .035;
sun.shadow.bias = -.00015;
sun.shadow.radius = 3;
sun.target.position.set(0, 0, 0);
scene.add(sun, sun.target);

const luminousMaterials = [];
function material(color, options = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: .72, ...options });
}
function luminous(color, day = .12, night = 2.5, options = {}) {
  const m = material(color, {
    emissive: color, emissiveIntensity: day, roughness: .35, ...options
  });
  luminousMaterials.push({ material: m, day, night });
  return m;
}
const M = {
  cream: material('#fff0d0'),
  stone: material('#dfd5b8'),
  paving: material('#ecdbb7'),
  pavingDark: material('#cebd9c'),
  grass: material('#82b88c'),
  grassLight: material('#8abd91'),
  grassDark: material('#74ad80'),
  foundation: material('#35646b'),
  teal: material('#287b83', { metalness: .23, roughness: .43 }),
  aqua: material('#4bb9b2', { metalness: .15, roughness: .35 }),
  dark: material('#20434f', { roughness: .5 }),
  coral: material('#e97860'),
  pink: material('#e89498'),
  gold: material('#efbd65', { metalness: .3, roughness: .4 }),
  wood: material('#b98053'),
  trunk: material('#876449'),
  green: material('#438e69'),
  green2: material('#65a675'),
  green3: material('#8abb7d'),
  white: material('#fff7e5'),
  rubber: material('#253740'),
  glass: material('#9ddbdc', {
    transparent: true, opacity: .46, metalness: .12, roughness: .15
  }),
  yellowBulb: luminous('#ffe6a1', .25, 4.0),
  aquaBulb: luminous('#6cefe1', .12, 3.0),
  pinkBulb: luminous('#ffaaa4', .18, 3.0),
  window: luminous('#ffd597', .10, 1.1),
  rail: luminous('#f3ba55', .07, .68, { metalness: .32 }),
  water: luminous('#59beca', .05, .38, { roughness: .2, metalness: .25 })
};

const unitBox = new THREE.BoxGeometry(1, 1, 1);
const unitCylinder = new THREE.CylinderGeometry(1, 1, 1, 12);
const unitSphere = new THREE.SphereGeometry(1, 12, 9);
const foliageGeometry = new THREE.IcosahedronGeometry(1, 1);
const unitCone = new THREE.ConeGeometry(1, 1, 9);
const identityQ = new THREE.Quaternion();
const upAxis = V(0, 1, 0);
const batches = new Map();

function mesh(geometry, mat, x = 0, y = 0, z = 0, parent = scene) {
  const object = new THREE.Mesh(geometry, mat);
  object.position.set(x, y, z);
  object.castShadow = !mat.transparent;
  object.receiveShadow = true;
  parent.add(object);
  return object;
}
function box(w, h, d, mat, x = 0, y = 0, z = 0, parent = scene) {
  const o = mesh(unitBox, mat, x, y, z, parent);
  o.scale.set(w, h, d);
  return o;
}
function cylinder(r, h, mat, x = 0, y = 0, z = 0, parent = scene) {
  const o = mesh(unitCylinder, mat, x, y, z, parent);
  o.scale.set(r, h, r);
  return o;
}
function sphere(r, mat, x = 0, y = 0, z = 0, parent = scene) {
  const o = mesh(unitSphere, mat, x, y, z, parent);
  o.scale.setScalar(r);
  return o;
}
function instance(geometry, mat, position, scale, quaternion = identityQ, parent = scene) {
  const key = geometry.uuid + mat.uuid + parent.uuid;
  if (!batches.has(key)) {
    batches.set(key, { geometry, mat, parent, matrices: [] });
  }
  batches.get(key).matrices.push(
    new THREE.Matrix4().compose(position, quaternion, scale)
  );
}
function ibox(w, h, d, mat, x, y, z, parent = scene) {
  instance(unitBox, mat, V(x, y, z), V(w, h, d), identityQ, parent);
}
function isphere(r, mat, x, y, z, parent = scene, stretch = V(1, 1, 1)) {
  instance(
    unitSphere, mat, V(x, y, z),
    stretch.clone().multiplyScalar(r), identityQ, parent
  );
}
function rod(a, b, r, mat, parent = scene) {
  const delta = b.clone().sub(a);
  const q = new THREE.Quaternion().setFromUnitVectors(
    upAxis, delta.clone().normalize()
  );
  instance(
    unitCylinder, mat, a.clone().add(b).multiplyScalar(.5),
    V(r, delta.length(), r), q, parent
  );
}
function flushInstances() {
  for (const { geometry, mat, parent, matrices } of batches.values()) {
    const o = new THREE.InstancedMesh(geometry, mat, matrices.length);
    matrices.forEach((matrix, i) => o.setMatrixAt(i, matrix));
    o.castShadow = !mat.transparent && !mat.emissive?.getHex();
    o.receiveShadow = true;
    o.instanceMatrix.needsUpdate = true;
    o.computeBoundingSphere();
    parent.add(o);
  }
  batches.clear();
}
function torus(r, tube, mat, x, y, z, parent = scene, horizontal = false) {
  const o = mesh(
    new THREE.TorusGeometry(r, tube, 8, 96), mat, x, y, z, parent
  );
  if (horizontal) o.rotation.x = Math.PI / 2;
  return o;
}
function roundedShape(w, d, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -d / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + d - r);
  s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
  s.lineTo(x + r, y + d);
  s.quadraticCurveTo(x, y + d, x, y + d - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function slab(w, d, h, radius, mat, x, top, z) {
  const geo = new THREE.ExtrudeGeometry(roundedShape(w, d, radius), {
    depth: h, bevelEnabled: false, curveSegments: 8
  });
  const o = mesh(geo, mat, x, top - h, z);
  o.rotation.x = -Math.PI / 2;
  return o;
}
function floorRing(r, width, mat, x, y, z) {
  const o = mesh(new THREE.RingGeometry(r - width, r, 96), mat, x, y, z);
  o.rotation.x = -Math.PI / 2;
  o.castShadow = false;
  return o;
}

let seed = 2317;
function random() {
  seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
  return seed / 4294967296;
}

const groundMaterial = material('#b6d0d1');
const ground = mesh(
  new THREE.PlaneGeometry(700, 700), groundMaterial, 0, -2.74, 0
);
ground.rotation.x = -Math.PI / 2;
ground.castShadow = false;

slab(98, 76, 1.3, 6, M.foundation, 0, -1.4, 0);
slab(96, 74, 1.4, 5.5, M.stone, 0, 0, 0);
slab(94.6, 72.6, .12, 5.2, M.grass, 0, .1, 0);
slab(90, 68, .045, 5, M.paving, 0, .15, 0);
slab(83.7, 61.7, .035, 4, M.grass, 0, .19, 0);
slab(5.8, 64, .04, 1.5, M.paving, -5, .23, 0);
slab(80, 4.2, .04, 1.3, M.paving, 0, .24, 1);
slab(80, 3.6, .04, 1.2, M.paving, 0, .24, 25);
slab(18, 3.8, .04, 1.2, M.paving, -13, .24, 12);
slab(20, 3.4, .04, 1, M.paving, -15, .24, -8);
slab(3.6, 11, .04, 1, M.paving, -36, .24, 22);

for (let z = -29; z <= 29; z += 2.2) {
  ibox(.22, .025, .8, M.pavingDark, -7.6, .26, z);
  ibox(.22, .025, .8, M.pavingDark, -2.4, .26, z);
}
for (const [x, z, r] of [
  [-26, -17, 12.6], [-21, 12, 9.8], [-5, -20, 5.2], [-5, 25, 6]
]) {
  cylinder(r, .1, M.paving, x, .23, z);
  floorRing(r - .25, .14, M.cream, x, .289, z);
}

/* Canvas-generated signage and light halos. */
function sign(
  text, subtitle, w, h, x, y, z, parent = scene,
  bg = '#245562', fg = '#fff1c9'
) {
  const canvas = document.createElement('canvas');
  canvas.width = 1024;
  canvas.height = Math.max(128, Math.round(1024 * h / w));
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = fg;
  ctx.lineWidth = 5;
  ctx.strokeRect(13, 13, W - 26, H - 26);
  ctx.fillStyle = fg;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const mainSize = Math.min(
    H * (subtitle ? .43 : .56), W / (text.length * .66)
  );
  ctx.font = `800 ${mainSize}px sans-serif`;
  ctx.fillText(text, W / 2, H * (subtitle ? .42 : .51));
  if (subtitle) {
    ctx.font = `600 ${H * .135}px sans-serif`;
    ctx.fillText(subtitle, W / 2, H * .77);
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = Math.min(
    8, renderer.capabilities.getMaxAnisotropy()
  );
  const mat = material('#ffffff', {
    map: texture, emissive: '#ffffff',
    emissiveMap: texture, emissiveIntensity: .08
  });
  luminousMaterials.push({ material: mat, day: .08, night: .65 });
  box(w + .14, h + .14, .2, M.gold, x, y, z - .13, parent);
  return mesh(new THREE.PlaneGeometry(w, h), mat, x, y, z, parent);
}
function standingSign(text, subtitle, x, z, width = 6) {
  rod(
    V(x - width * .36, .2, z),
    V(x - width * .36, 3.6, z), .095, M.teal
  );
  rod(
    V(x + width * .36, .2, z),
    V(x + width * .36, 3.6, z), .095, M.teal
  );
  sign(text, subtitle, width, 1.5, x, 3.1, z + .12);
}

const haloCanvas = document.createElement('canvas');
haloCanvas.width = haloCanvas.height = 64;
const hc = haloCanvas.getContext('2d');
const gradient = hc.createRadialGradient(32, 32, 0, 32, 32, 32);
gradient.addColorStop(0, 'rgba(255,255,255,1)');
gradient.addColorStop(.13, 'rgba(255,255,255,.65)');
gradient.addColorStop(.4, 'rgba(255,255,255,.15)');
gradient.addColorStop(1, 'rgba(255,255,255,0)');
hc.fillStyle = gradient;
hc.fillRect(0, 0, 64, 64);
const haloTexture = new THREE.CanvasTexture(haloCanvas);
const haloMaterials = new Map();
const halos = [];

function halo(x, y, z, size, color, parent = scene) {
  if (!haloMaterials.has(color)) {
    haloMaterials.set(color, new THREE.SpriteMaterial({
      map: haloTexture, color, transparent: true, opacity: .75,
      blending: THREE.AdditiveBlending,
      depthWrite: false, toneMapped: false
    }));
  }
  const o = new THREE.Sprite(haloMaterials.get(color));
  o.position.set(x, y, z);
  o.scale.setScalar(size);
  parent.add(o);
  halos.push(o);
  return o;
}

const nightLights = [];
function nightLight(color, intensity, distance, x, y, z) {
  const light = new THREE.PointLight(color, 0, distance, 2);
  light.position.set(x, y, z);
  scene.add(light);
  nightLights.push({ light, intensity });
  return light;
}

/* Ferris wheel. */
const wheelRoot = new THREE.Group();
wheelRoot.position.set(-26, .3, -17);
wheelRoot.name = 'Sky Wheel';
scene.add(wheelRoot);
cylinder(7, .45, M.cream, 0, .2, 0, wheelRoot);
floorRing(6.6, .18, M.gold, -26, .76, -17);

for (const z of [-2.5, 2.5]) {
  rod(V(-6.6, .4, z), V(0, 18, z * .47), .4, M.cream, wheelRoot);
  rod(V(6.6, .4, z), V(0, 18, z * .47), .4, M.cream, wheelRoot);
  rod(
    V(-4.6, 5.5, z * .9), V(4.6, 5.5, z * .9),
    .19, M.teal, wheelRoot
  );
  for (const x of [-6.6, 6.6]) {
    box(1.7, .5, 2.1, M.teal, x, .5, z, wheelRoot);
  }
}
rod(V(0, 18, -3.2), V(0, 18, 3.2), .53, M.gold, wheelRoot);

const wheel = new THREE.Group();
wheel.name = 'Ferris wheel rotating assembly';
wheel.position.set(0, 18, 0);
wheelRoot.add(wheel);

const wheelRadius = 11.8;
for (const z of [-.75, .75]) {
  torus(wheelRadius, .22, M.teal, 0, 0, z, wheel);
  torus(wheelRadius - .48, .09, M.cream, 0, 0, z, wheel);
  torus(3.4, .1, M.gold, 0, 0, z, wheel);
  for (let i = 0; i < 12; i++) {
    const a = i * TAU / 12;
    rod(
      V(0, 0, z),
      V(Math.cos(a) * wheelRadius, Math.sin(a) * wheelRadius, z),
      .085, M.cream, wheel
    );
    rod(
      V(Math.cos(a) * 3.4, Math.sin(a) * 3.4, z),
      V(
        Math.cos(a + TAU / 12) * wheelRadius,
        Math.sin(a + TAU / 12) * wheelRadius, z
      ),
      .038, M.gold, wheel
    );
  }
}
for (let i = 0; i < 60; i++) {
  const a = i * TAU / 60;
  isphere(
    .12, i % 3 ? M.yellowBulb : M.aquaBulb,
    Math.cos(a) * wheelRadius, Math.sin(a) * wheelRadius, .99, wheel
  );
  if (i % 3 === 0) {
    halo(
      Math.cos(a) * wheelRadius, Math.sin(a) * wheelRadius,
      1.05, .95, '#ffd994', wheel
    );
  }
}
const hub = cylinder(1.35, 2.4, M.teal, 0, 0, 0, wheel);
hub.rotation.x = Math.PI / 2;

class VerticalLoopCurve extends THREE.Curve {
  constructor() {
    super();
    this.arcLengthDivisions = 600;
  }
  getPoint(t, target = new THREE.Vector3()) {
    const a = TAU * t;
    return target.set(
      20 + 10 * Math.sin(a),
      3.1 + 10 * (1 - Math.cos(a)),
      12 + 4 * t
    );
  }
}

const F = V(8, 3.1, 10.5);

function bezier(a, b, c, d) {

const loopFraction = loopCurve.getLength() / coasterLength;

/* Continuous rotation-minimizing frames, including upside-down frames. */
const frameCount = 1800;
const tangents = [];
const frameUps = [];
const frameQuaternions = [];

let previousTangent = coasterCurve.getTangentAt(0).normalize();
let transportedUp = V(0, 1, 0);
transportedUp
  .addScaledVector(previousTangent, -transportedUp.dot(previousTangent))
  .normalize();

for (let i = 0; i <= frameCount; i++) {
  const tangent = coasterCurve.getTangentAt(i / frameCount).normalize();
  if (i) {
    const transport = new THREE.Quaternion().setFromUnitVectors(
      previousTangent, tangent
    );
    transportedUp.applyQuaternion(transport);
    transportedUp
      .addScaledVector(tangent, -transportedUp.dot(tangent))
      .normalize();
  }
  tangents.push(tangent.clone());
  frameUps.push(transportedUp.clone());
  previousTangent = tangent;
}

const endUp = frameUps[frameCount];
const startUp = frameUps[0];
const closureTwist = Math.atan2(
  tangents[0].dot(new THREE.Vector3().crossVectors(endUp, startUp)),
  THREE.MathUtils.clamp(endUp.dot(startUp), -1, 1)
);

for (let i = 0; i <= frameCount; i++) {
  const tangent = tangents[i];
  const up = frameUps[i].clone().applyAxisAngle(
    tangent, closureTwist * i / frameCount
  );
  const side = new THREE.Vector3().crossVectors(up, tangent).normalize();
  up.crossVectors(tangent, side).normalize();
  const matrix = new THREE.Matrix4().makeBasis(side, up, tangent);
  frameQuaternions.push(new THREE.Quaternion().setFromRotationMatrix(matrix));
}
frameQuaternions[frameCount].copy(frameQuaternions[0]);

function trackFrame(u) {
  const wrapped = ((u % 1) + 1) % 1;
  const v = wrapped * frameCount;
  const i = Math.floor(v);
  const q = frameQuaternions[i].clone().slerp(
    frameQuaternions[i + 1], v - i
  );
  return {
    quaternion: q,
    side: V(1, 0, 0).applyQuaternion(q),
    up: V(0, 1, 0).applyQuaternion(q)
  };
}

class OffsetTrackCurve extends THREE.Curve {
  constructor(side, height) {
    super();
    this.side = side;
    this.height = height;
  }
  getPoint(t, target = new THREE.Vector3()) {
    const f = trackFrame(t);
    return target.copy(coasterCurve.getPointAt(t))
      .addScaledVector(f.side, this.side)
      .addScaledVector(f.up, this.height);
  }
}

function coasterSupport(u, brace = false) {
  const f = trackFrame(u);
  const p = coasterCurve.getPointAt(u);
  const top = p.clone().addScaledVector(f.up, -.5);

  rod(V(top.x, .4, top.z), top, .18, M.teal);
  ibox(1.05, .28, 1.05, M.stone, top.x, .33, top.z);
  rod(
    p.clone().addScaledVector(f.side, -1.2).addScaledVector(f.up, -.3),
    p.clone().addScaledVector(f.side, 1.2).addScaledVector(f.up, -.3),
    .13, M.teal
  );
  rod(top, p.clone().addScaledVector(f.up, -.26), .13, M.teal);

  if (brace && top.y > 6) {
    rod(
      V(top.x + 2.3, .4, top.z),
      V(top.x, top.y * .68, top.z), .1, M.teal
    );
    ibox(.7, .2, .7, M.stone, top.x + 2.3, .3, top.z);
  }
}

for (let i = 0; i < supportCount; i++) {

  );
}

function fence(x1, z1, x2, z2) {
  const a = V(x1, 0, z1), b = V(x2, 0, z2);
  const count = Math.ceil(a.distanceTo(b) / 2);
  for (let i = 0; i <= count; i++) {
    const p = a.clone().lerp(b, i / count);
    rod(V(p.x, .18, p.z), V(p.x, 1.85, p.z), .085, M.teal);
    isphere(.13, M.gold, p.x, 1.9, p.z);
  }
  for (const y of [.85, 1.5]) {
    rod(V(x1, y, z1), V(x2, y, z2), .055, M.cream);
  }
}

  cylinder(1.05 * size, .15, M.pavingDark, x, .25, z);

  if (pine) {
    for (let k = 0; k < 3; k++) {
      instance(
        unitCone, k % 2 ? M.green2 : M.green,
        V(x, (2.4 + k * .96) * size, z),
        V(
          (1.6 - k * .33) * size,
          2.4 * size,
          (1.6 - k * .33) * size
        )
      );
    }
  } else {
    instance(
      foliageGeometry, M.green,
      V(x, 3.5 * size, z),
      V(1.6, 1.9, 1.5).multiplyScalar(size)
    );
    instance(
      foliageGeometry, M.green2,
      V(x - .75 * size, 3.1 * size, z + .3 * size),
      V(1.15, 1.35, 1.2).multiplyScalar(size)
    );
    instance(
      foliageGeometry, M.green3,
      V(x + .6 * size, 4 * size, z - .15 * size),
      V(1.12, 1.3, 1.1).multiplyScalar(size)
    );
  }
}

}

function visitor(x, z, index, scale = 1) {
  const skin = skinMaterials[index % skinMaterials.length];
  const shirt = shirtMaterials[index % shirtMaterials.length];
  const y = .28;

  for (const side of [-1, 1]) {
    ibox(
      .14 * scale, .48 * scale, .17 * scale, M.dark,
      x + side * .13 * scale, y + .29 * scale, z
    );
    ibox(
      .17 * scale, .12 * scale, .28 * scale, M.rubber,
      x + side * .13 * scale, y + .06 * scale, z + .04
    );
    rod(
      V(x + side * .31 * scale, y + 1.08 * scale, z),
      V(x + side * .38 * scale, y + .67 * scale, z + .04),
      .075 * scale, skin
    );
  }
  instance(
    unitCylinder, shirt,
    V(x, y + .84 * scale, z),
    V(.25 * scale, .65 * scale, .2 * scale)
  );
  isphere(.23 * scale, skin, x, y + 1.45 * scale, z);
  isphere(
    .235 * scale, index % 3 ? M.dark : M.wood,
    x, y + 1.57 * scale, z - .025, scene, V(1, .55, 1)
  );
}

for (const [x, z, color] of [

flushInstances();

/* Procedural star field. */
const starPositions = [];
for (let i = 0; i < 360; i++) {
  const angle = random() * TAU;
  const radius = 100 + random() * 100;
  starPositions.push(
    Math.cos(angle) * radius,
    45 + random() * 120,
    Math.sin(angle) * radius
  );
}
const starGeometry = new THREE.BufferGeometry();
starGeometry.setAttribute(
  'position', new THREE.Float32BufferAttribute(starPositions, 3)
);
const stars = new THREE.Points(
  starGeometry,
  new THREE.PointsMaterial({
    color: '#e2f6ff', size: 1.7, sizeAttenuation: false,
    transparent: true, opacity: .8,
    depthWrite: false, fog: false, toneMapped: false
  })
);
scene.add(stars);

let night = false;

function setNight(value) {
  night = Boolean(value);

  scene.background.set(night ? '#0b1b30' : '#bfd9de');
  scene.fog.color.copy(scene.background);
  groundMaterial.color.set(night ? '#163248' : '#b6d0d1');

  hemi.color.set(night ? '#9cbef0' : '#e4f7ff');
  hemi.groundColor.set(night ? '#456575' : '#a2a477');
  hemi.intensity = night ? .62 : 2.25;

  sun.color.set(night ? '#a0c7ff' : '#fff0d5');
  sun.intensity = night ? .65 : 3;

  renderer.toneMappingExposure = night ? 1.12 : 1.05;

  for (const entry of luminousMaterials) {
    entry.material.emissiveIntensity = night ? entry.night : entry.day;
  }
  for (const entry of nightLights) {
    entry.light.intensity = night ? entry.intensity : 0;
  }

  halos.forEach(o => { o.visible = night; });
  stars.visible = night;

  document.body.classList.toggle('night', night);
  document.querySelector('#nightButton').setAttribute(
    'aria-pressed', String(night)
  );
  document.querySelector('#modeIcon').textContent = night ? '☀' : '☾';
  document.querySelector('#modeText').textContent =
    night ? '昼の遊園地へ' : '夜の遊園地へ';
  document.querySelector('#timeLabel').textContent =
    night ? 'AFTER DARK / 20:30' : 'DAYLIGHT / 14:30';
}

document.querySelector('#nightButton').addEventListener(
  'click', () => setNight(!night)
);
addEventListener('keydown', event => {
  if (
    event.key.toLowerCase() === 'n' &&
    !event.repeat && !event.ctrlKey && !event.metaKey && !event.altKey
  ) {
    setNight(!night);
  }
});

window.park = {
  scene,
  camera,
  renderer,
  wheel,
  gondolas,
  coasterCurve,
  coasterCar,
  getCoasterProgress: () => coasterProgress,
  carousel,
  setNight,
  isNight: () => night
};

/*
 * 全乗り物を実経過時間から直接計算する。
 * フレーム間隔を切り詰めないため、低FPSでも回転速度が低下しない。
 * 観覧車は約45秒で一周し、ゴンドラの逆回転にも同じ角度を使う。
 */
const WHEEL_ANGULAR_SPEED = .14;
const CAROUSEL_ANGULAR_SPEED = .24;
const COASTER_SPEED = 9.5;

function updateRides(elapsedSeconds) {
  const wheelAngle = .16 + elapsedSeconds * WHEEL_ANGULAR_SPEED;

  wheel.rotation.z = wheelAngle;
  for (const pivot of gondolaPivots) {
    pivot.rotation.z = -wheelAngle;
  }

  carousel.rotation.y = .1 + elapsedSeconds * CAROUSEL_ANGULAR_SPEED;
  horses.forEach((horse, i) => {
    horse.position.y =
      3.1 + .38 * Math.sin(elapsedSeconds * 1.8 + i * Math.PI / 2);
  });

  coasterProgress = (
    coasterStartProgress + elapsedSeconds * COASTER_SPEED / coasterLength
  ) % 1;

  coasterCars.forEach((car, i) => {
    const u = (
      (coasterProgress - i * 2.95 / coasterLength) % 1 + 1
    ) % 1;
    const frame = trackFrame(u);
    car.position.copy(coasterCurve.getPointAt(u))
      .addScaledVector(frame.up, .57);
    car.quaternion.copy(frame.quaternion);
  });

  jets.forEach(({ curve, drop, phase }) => {
    drop.position.copy(
      curve.getPoint((elapsedSeconds * .65 + phase) % 1)
    );
  });

  balloons.forEach((balloon, i) => {
    balloon.position.y = .08 * Math.sin(elapsedSeconds * 1.5 + i);
    balloon.rotation.z = .04 * Math.sin(elapsedSeconds + i);
  });
}

setNight(false);
updateRides(0);
scene.updateMatrixWorld(true);

const animationEpoch = performance.now();

function animate(now) {
  requestAnimationFrame(animate);

  const elapsedSeconds = Math.max(0, (now - animationEpoch) / 1000);
  updateRides(elapsedSeconds);

  controls.update();
  renderer.render(scene, camera);
}

requestAnimationFrame(animate);
</script>
