<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>Lumière Park — 小さな光の遊園地</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<style>
  :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#183e43}
  *{box-sizing:border-box}
  body{margin:0;overflow:hidden;background:#cbdedb}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .hud{position:fixed;z-index:5;pointer-events:none}
  .brand{left:38px;top:30px}
  .eyebrow{display:flex;align-items:center;gap:10px;font-size:10px;font-weight:750;letter-spacing:3px}
  .spark{width:25px;height:25px;display:grid;place-items:center;border:1px solid currentColor;border-radius:50%;font-size:17px}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:45px;font-weight:400;letter-spacing:-1.5px;line-height:1.05;margin:13px 0 9px}
  .subtitle{font-size:11px;letter-spacing:2px;opacity:.75}
  .actions{right:34px;top:32px;display:flex;gap:10px}
  button{pointer-events:auto;border:1px solid #ffffff8a;background:#ffffffe0;box-shadow:0 5px 24px #23484d12;color:#23464b;cursor:pointer;backdrop-filter:blur(16px);font:600 12px system-ui;transition:background .25s,transform .2s}
  button:hover{transform:translateY(-2px);background:white}
  button:focus-visible{outline:3px solid #eeb557;outline-offset:4px}
  #night{height:46px;border-radius:25px;padding:0 19px;display:flex;align-items:center;gap:10px}
  #nightIcon{font-size:21px;font-weight:400}
  .key{font-size:9px;border:1px solid #adc1bf;border-radius:4px;padding:2px 4px;opacity:.6;margin-left:8px}
  #reset{width:46px;height:46px;border-radius:50%;font-size:23px;font-weight:400}
  .bottom-left{left:38px;bottom:29px}
  .open{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;letter-spacing:2px}
  .dot{width:6px;height:6px;border-radius:50%;background:#d1903e;box-shadow:0 0 0 4px #d1903e18}
  .caption{font:italic 17px Georgia,serif;opacity:.65;margin-top:9px}
  .instructions{bottom:27px;left:50%;transform:translateX(-50%);padding:12px 21px;border:1px solid #ffffff65;background:#ffffffb0;backdrop-filter:blur(12px);border-radius:25px;white-space:nowrap;font-size:10px;letter-spacing:1px;display:flex;gap:17px}
  .instructions span+span{border-left:1px solid #7d999946;padding-left:17px}
  .time{right:38px;bottom:28px;text-align:right}
  .time small{display:block;font-size:9px;letter-spacing:2px;margin-bottom:5px;opacity:.6}
  #clockLabel{font:30px Georgia,serif;letter-spacing:1px}
  #season{font-size:9px;letter-spacing:2px;margin-top:4px;opacity:.7}
  .night{color:#e3efee;background:#091b31}
  .night button{background:#172e43dc;color:#eff3e8;border-color:#8ca3b835}
  .night button:hover{background:#25435b}
  .night .instructions{background:#152c42bc;border-color:#a7bec52a}
  .night .dot{background:#ffd787;box-shadow:0 0 12px #ffd78799}
  @media(max-width:700px){
    .brand{left:20px;top:23px}h1{font-size:31px}.eyebrow{font-size:8px;letter-spacing:1.5px}
    .subtitle{font-size:9px;letter-spacing:.8px}.actions{right:16px;top:20px}
    #night{padding:0 12px}.key,#reset{display:none}
    .bottom-left{left:20px;bottom:22px}.caption{font-size:13px}
    .instructions{bottom:83px;font-size:9px;padding:10px 15px}
    .time{right:20px;bottom:22px}
  }
</style>

<body>
<header class="hud brand">
  <div class="eyebrow"><span class="spark">✧</span>A LITTLE WORLD OF WONDER</div>
  <h1>Lumière Park</h1>
  <div class="subtitle">ルミエール・パーク ── 小さな世界に、大きなときめき。</div>
</header>
<div class="hud actions">
  <button id="reset" aria-label="最初の視点に戻す" title="最初の視点に戻す">↺</button>
  <button id="night" type="button" aria-pressed="false">
    <span id="nightIcon">☾</span><span id="nightLabel">夜のパークへ</span><span class="key">N</span>
  </button>
</div>
<div class="hud bottom-left">
  <div class="open"><span class="dot"></span>THE PARK IS OPEN</div>
  <div class="caption">A pocket-sized escape, made of light.</div>
</div>
<div class="hud instructions">
  <span>ドラッグで回転</span><span>スクロールでズーム</span><span>右ドラッグで移動</span>
</div>
<div class="hud time">
  <small>LOCAL PARK TIME</small>
  <div id="clockLabel">14:30</div>
  <div id="season">ENDLESS SUMMER</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const TAU = Math.PI * 2;
const V = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
let seed = 73019;
function rand() {
  seed = (Math.imul(seed,1664525) + 1013904223) >>> 0;
  return seed / 4294967296;
}

const scene = new THREE.Scene();
scene.background = new THREE.Color('#cbdedb');
scene.fog = new THREE.Fog('#cbdedb',150,295);

const camera = new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,450);
camera.position.set(72,59,80);

const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.target.set(0,7,0);
controls.enableDamping = true;
controls.dampingFactor = .065;
controls.minDistance = 28;
controls.maxDistance = 185;
controls.maxPolarAngle = Math.PI*.485;
controls.minPolarAngle = .13;
controls.update();
controls.saveState();
document.querySelector('#reset').onclick = () => controls.reset();

const hemi = new THREE.HemisphereLight('#e7f7ff','#83a571',2.0);
scene.add(hemi);
const ambient = new THREE.AmbientLight('#fff4dc',.2);
scene.add(ambient);
const sun = new THREE.DirectionalLight('#fff0d5',3.2);
sun.position.set(-36,65,38);
sun.castShadow = true;
sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-61,right:61,top:57,bottom:-57,near:1,far:155});
sun.shadow.normalBias = .035;
sun.shadow.bias = -.00015;
sun.shadow.radius = 3;
sun.target.position.set(0,0,0);
scene.add(sun,sun.target);

function material(color,extra={}) {
  return new THREE.MeshStandardMaterial({color,roughness:.72,...extra});
}
const M = {
  grass:material('#8cbf92'),
  grassDark:material('#619b78'),
  soil:material('#b17c60'),
  cream:material('#fff0cc'),
  white:material('#fff9e9'),
  teal:material('#287c80'),
  dark:material('#264954'),
  coral:material('#ea7969'),
  pink:material('#f0a5a4'),
  yellow:material('#eeb951'),
  blue:material('#64b6c4'),
  metal:material('#557983',{metalness:.5,roughness:.4}),
  gold:material('#d7a64a',{metalness:.45,roughness:.35}),
  wood:material('#b78153'),
  leaf:material('#4f9673'),
  leafLight:material('#82b47b'),
  leafDark:material('#33775e'),
  black:material('#26343c'),
  water:material('#51bacb',{metalness:.35,roughness:.19,emissive:'#258fbc',emissiveIntensity:.12}),
  glass:material('#8dcdd4',{metalness:.2,roughness:.23,transparent:true,opacity:.46}),
  window:material('#476f75',{emissive:'#ffc46b',emissiveIntensity:.04,roughness:.3})
};
const bulbMat = material('#fff1c5',{emissive:'#ffc779',emissiveIntensity:.35,toneMapped:false});
const aquaBulb = material('#cefaff',{emissive:'#71eaff',emissiveIntensity:.35,toneMapped:false});
const roseBulb = material('#ffe3d6',{emissive:'#ff8275',emissiveIntensity:.25,toneMapped:false});

const unitBox = new THREE.BoxGeometry(1,1,1);
const unitSphere = new THREE.SphereGeometry(1,16,12);
const unitCylinder = new THREE.CylinderGeometry(1,1,1,12);
const unitCone = new THREE.ConeGeometry(1,1,12);
const dummy = new THREE.Object3D();

function group(parent=scene,x=0,y=0,z=0) {
  const g = new THREE.Group();
  g.position.set(x,y,z);
  parent.add(g);
  return g;
}
function mesh(geometry,mat,parent=scene) {
  const o = new THREE.Mesh(geometry,mat);
  o.castShadow = true;
  o.receiveShadow = true;
  parent.add(o);
  return o;
}
function box(parent,w,h,d,x,y,z,mat) {
  const o = mesh(unitBox,mat,parent);
  o.scale.set(w,h,d);
  o.position.set(x,y,z);
  return o;
}
function sphere(parent,x,y,z,r,mat,scale=null) {
  const o = mesh(unitSphere,mat,parent);
  o.position.set(x,y,z);
  o.scale.setScalar(r);
  if(scale) o.scale.multiply(scale);
  return o;
}
function cylinder(parent,r,h,x,y,z,mat) {
  const o = mesh(unitCylinder,mat,parent);
  o.position.set(x,y,z);
  o.scale.set(r,h,r);
  return o;
}
function cone(parent,r,h,x,y,z,mat) {
  const o = mesh(unitCone,mat,parent);
  o.position.set(x,y,z);
  o.scale.set(r,h,r);
  return o;
}
function beam(parent,a,b,r,mat) {
  const direction = b.clone().sub(a);
  const o = mesh(unitCylinder,mat,parent);
  o.position.copy(a).add(b).multiplyScalar(.5);
  o.scale.set(r,direction.length(),r);
  o.quaternion.setFromUnitVectors(V(0,1,0),direction.normalize());
  return o;
}
function torus(parent,r,t,x,y,z,mat,horizontal=false,segments=96) {
  const o = mesh(new THREE.TorusGeometry(r,t,8,segments),mat,parent);
  o.position.set(x,y,z);
  if(horizontal) o.rotation.x = Math.PI/2;
  return o;
}
function instance(geometry,mat,transforms,parent=scene,shadow=true) {
  const o = new THREE.InstancedMesh(geometry,mat,transforms.length);
  transforms.forEach((t,i) => {
    dummy.position.copy(t.p);
    dummy.quaternion.copy(t.q || new THREE.Quaternion());
    dummy.scale.copy(t.s || V(1,1,1));
    dummy.updateMatrix();
    o.setMatrixAt(i,dummy.matrix);
  });
  o.castShadow = shadow;
  o.receiveShadow = true;
  parent.add(o);
  return o;
}
function dots(parent,positions,mat=bulbMat,r=.1) {
  return instance(unitSphere,mat,positions.map(p=>({p,s:V(r,r,r)})),parent,false);
}
function roundShape(w,d,r) {
  const s = new THREE.Shape(), x=-w/2, y=-d/2;
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+d-r);s.quadraticCurveTo(x+w,y+d,x+w-r,y+d);
  s.lineTo(x+r,y+d);s.quadraticCurveTo(x,y+d,x,y+d-r);
  s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);
  return s;
}
function slab(w,d,r,height,y,mat) {
  const geo = new THREE.ExtrudeGeometry(roundShape(w,d,r),{
    depth:height,bevelEnabled:true,bevelSegments:3,steps:1,
    bevelSize:.22,bevelThickness:.18,curveSegments:10
  });
  geo.rotateX(-Math.PI/2);
  const o = mesh(geo,mat);
  o.position.y = y;
  return o;
}

const groundMat = material('#cbdedb');
const ground = mesh(new THREE.PlaneGeometry(1200,1200),groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = -3.5;
ground.castShadow = false;
slab(79,59,6,2.2,-3.0,M.soil);
slab(79.1,59.1,6,.45,-.9,M.cream);
slab(78.6,58.6,5.9,.55,-.45,M.grass);

function pavingTexture() {
  const c = document.createElement('canvas');
  c.width=c.height=256;
  const ctx = c.getContext('2d');
  ctx.fillStyle='#e9d8b6';
  ctx.fillRect(0,0,256,256);
  for(let row=0;row<8;row++) {
    for(let col=-1;col<5;col++) {
      const x=col*64+(row%2)*32;
      ctx.fillStyle=['#eddfc2','#eadabb','#f1e3c8','#e4d4b4'][Math.floor(rand()*4)];
      ctx.fillRect(x+1,row*32+1,62,30);
    }
  }
  for(let i=0;i<1800;i++) {
    ctx.fillStyle=rand()>.5?'#ffffff19':'#786b5010';
    ctx.fillRect(rand()*256,rand()*256,1.5,1.5);
  }
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(.34,.34);
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  return t;
}
const pathMat = material('#ffffff',{map:pavingTexture(),roughness:.95});
function pathRect(x,z,w,d) {
  const geo = new THREE.PlaneGeometry(w,d);
  const uv=geo.attributes.uv;
  for(let i=0;i<uv.count;i++) uv.setXY(i,uv.getX(i)*w,uv.getY(i)*d);
  const o = mesh(geo,pathMat);
  o.rotation.x=-Math.PI/2;
  o.position.set(x,.19,z);
  o.castShadow=false;
  return o;
}
function pavedCircle(x,z,r) {
  const geo=new THREE.CircleGeometry(r,80);
  const p=geo.attributes.position,uv=geo.attributes.uv;
  for(let i=0;i<uv.count;i++) uv.setXY(i,p.getX(i),p.getY(i));
  const o=mesh(geo,pathMat);
  o.rotation.x=-Math.PI/2;
  o.position.set(x,.205,z);
  o.castShadow=false;
}
pathRect(-3,8,5.8,40);
pathRect(0,2,67,4.3);
pathRect(0,21,65,4);
pathRect(-6,-21,53,3.5);
pathRect(-21,-6,4.5,28);
pathRect(30,10,3.5,23);
pavedCircle(-3,0,6.7);
pavedCircle(-21,13,8.4);
pathRect(-21,-9,17,8);
pathRect(8,16,12,5);
torus(scene,6.4,.07,-3,.24,0,M.cream,true);

function labelTexture(title,subtitle,bg='#28575c',fg='#fff0cc') {
  const c=document.createElement('canvas');
  c.width=1024;c.height=256;
  const ctx=c.getContext('2d');
  ctx.fillStyle=bg;ctx.fillRect(0,0,1024,256);
  ctx.strokeStyle=fg;ctx.lineWidth=3;ctx.globalAlpha=.65;
  ctx.strokeRect(15,15,994,226);ctx.globalAlpha=1;
  ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='600 72px Georgia, serif';ctx.fillText(title,512,109,940);
  ctx.font='500 25px system-ui, sans-serif';ctx.fillText(subtitle,512,192,930);
  const texture=new THREE.CanvasTexture(c);
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.anisotropy=4;
  return texture;
}
function sign(parent,title,subtitle,w,h,x,y,z,bg,fg) {
  box(parent,w+.15,h+.15,.16,x,y,z-.05,M.gold);
  const m=new THREE.MeshBasicMaterial({
    map:labelTexture(title,subtitle,bg,fg),
    side:THREE.DoubleSide
  });
  const p=mesh(new THREE.PlaneGeometry(w,h),m,parent);
  p.position.set(x,y,z+.05);
  p.castShadow=false;
  return p;
}

const nightLights=[];
const glowSprites=[];
const glowCanvas=document.createElement('canvas');
glowCanvas.width=glowCanvas.height=64;
{
  const c=glowCanvas.getContext('2d');
  const g=c.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,242,199,.9)');
  g.addColorStop(.16,'rgba(255,219,147,.42)');
  g.addColorStop(.45,'rgba(255,197,112,.10)');
  g.addColorStop(1,'rgba(255,180,90,0)');
  c.fillStyle=g;c.fillRect(0,0,64,64);
}
const glowTex=new THREE.CanvasTexture(glowCanvas);
function glow(parent,x,y,z,size=2,color='#ffdb9e') {
  const mat=new THREE.SpriteMaterial({
    map:glowTex,color,transparent:true,blending:THREE.AdditiveBlending,
    depthWrite:false,toneMapped:false
  });
  const s=new THREE.Sprite(mat);
  s.position.set(x,y,z);
  s.scale.set(size,size,1);
  s.visible=false;
  parent.add(s);
  glowSprites.push(s);
  return s;
}
function nightLight(parent,color,intensity,distance,x,y,z) {
  const light=new THREE.PointLight(color,0,distance,2);
  light.position.set(x,y,z);
  parent.add(light);
  nightLights.push({light,intensity});
  return light;
}

// 観覧車：輪の回転を、吊り下げキャビンの逆回転で相殺する。
const wheelSite=group(scene,-21,0,-9);
cylinder(wheelSite,7.9,.35,0,.4,0,M.cream);
box(wheelSite,12,.45,6,0,.7,0,M.teal);
for(const z of [-2.5,2.5]) {
  for(const x of [-6,6]) {
    box(wheelSite,1.8,.5,1.8,x,.55,z,M.cream);
    beam(wheelSite,V(x,.8,z),V(0,17.6,z*.27),.34,M.coral);
  }
  beam(wheelSite,V(-4.4,5,z*.8),V(4.4,5,z*.8),.17,M.cream);
}
beam(wheelSite,V(0,17.6,-3),V(0,17.6,3),.46,M.gold);
const wheel=group(wheelSite,0,17.6,0);
const wheelRadius=11.8;
for(const z of [-.72,.72]) {
  torus(wheel,wheelRadius,.20,0,0,z,M.teal);
  torus(wheel,wheelRadius-.55,.075,0,0,z,M.cream);
}
const rimBulbs=[];
for(let i=0;i<96;i++) {
  const a=TAU*i/96;
  rimBulbs.push(V(wheelRadius*Math.cos(a),wheelRadius*Math.sin(a),.96));
}
dots(wheel,rimBulbs,bulbMat,.11);

const gondolas=[];
const cabinColors=[M.coral,M.yellow,M.blue,M.pink];
for(let i=0;i<12;i++) {
  const a=i*TAU/12,x=wheelRadius*Math.cos(a),y=wheelRadius*Math.sin(a);
  for(const z of [-.72,.72]) {
    beam(wheel,V(0,0,z),V(x,y,z),.072,M.cream);
    const b=a+TAU/12;
    beam(wheel,V(x*.53,y*.53,z),V(wheelRadius*Math.cos(b),wheelRadius*Math.sin(b),z),.033,M.gold);
  }
  beam(wheel,V(x,y,-.85),V(x,y,.85),.12,M.gold);
  const cabin=group(wheel,x,y,0);
  gondolas.push(cabin);
  beam(cabin,V(0,0,0),V(0,-.65,0),.065,M.dark);
  const col=cabinColors[i%4];
  cylinder(cabin,1.03,.19,0,-.64,0,col);
  cone(cabin,1.05,.35,0,-.43,0,col);
  cylinder(cabin,.89,.72,0,-1.94,0,col);
  cylinder(cabin,.94,.13,0,-2.34,0,M.gold);
  for(const px of [-.62,.62]) {
    for(const pz of [-.48,.48]) {
      beam(cabin,V(px,-.72,pz),V(px,-1.76,pz),.045,M.cream);
    }
  }
  box(cabin,1.25,.82,1.01,0,-1.21,0,M.glass);
  box(cabin,1.25,.16,.6,0,-1.6,0,M.cream);
  sphere(cabin,-.32,-1.27,0,.19,M.wood);
  sphere(cabin,.32,-1.27,0,.19,M.cream);
  dots(cabin,[V(-.7,-.67,.65),V(.7,-.67,.65)],bulbMat,.075);
}
sphere(wheel,0,0,1.0,.76,M.gold,V(1,1,.4));
sphere(wheel,0,0,1.28,.39,M.coral,V(1,1,.35));
torus(wheelSite,1.0,.07,0,17.6,1.45,bulbMat);
nightLight(wheelSite,'#ffb774',120,29,0,12,3);
glow(wheelSite,0,17.6,1.7,3.3);
for(let i=0;i<3;i++) {
  box(wheelSite,8,.22,1.1,0,.25+i*.22,4.4-i*.9,M.cream);
}
sign(wheelSite,'SKY WHEEL','12 CABINS · A LITTLE CLOSER TO THE SKY',7.5,1.7,0,3.2,3.6);
for(const x of [-3.3,3.3]) cylinder(wheelSite,.09,2.3,x,1.6,3.55,M.gold);

// 閉じた線路。縦ループの入口と出口は奥行きをずらして接続する。
class VerticalLoop extends THREE.Curve {
  constructor() {
    super();
    this.arcLengthDivisions=800;
  }
  getPoint(t,target=new THREE.Vector3()) {
    const a=TAU*t;
    return target.set(17+9*Math.sin(a),4+9*(1-Math.cos(a)),5-4*t);
  }
  getTangent(t,target=new THREE.Vector3()) {
    const a=TAU*t;
    return target.set(18*Math.PI*Math.cos(a),18*Math.PI*Math.sin(a),-4).normalize();
  }
}
const coasterCurve=new THREE.CurvePath();
const loopCurve=new VerticalLoop();
coasterCurve.add(loopCurve);
const slope=4/(18*Math.PI);
function bezier(a,b,c,d) {
  coasterCurve.add(new THREE.CubicBezierCurve3(V(...a),V(...b),V(...c),V(...d)));
}
bezier([17,4,1],[24,4,1-7*slope],[33,5,-1],[33,7,-9]);
bezier([33,7,-9],[33,9,-17],[29,12,-21],[19,12,-21]);

// 平行移動フレームを使うので、ループ頂上で車両が正しく上下逆さになる。
const N=1800;
const trackPoints=[],tangents=[],ups=[],rights=[],frameQuaternions=[];
let transported=V(0,1,0);
const transportQ=new THREE.Quaternion();
for(let i=0;i<=N;i++) {
  const u=i/N;
  trackPoints.push(coasterCurve.getPointAt(u));
  const tangent=coasterCurve.getTangentAt(u).normalize();
  tangents.push(tangent);
  if(i>0) {
    transportQ.setFromUnitVectors(tangents[i-1],tangent);
    transported.applyQuaternion(transportQ);
  }
  transported.addScaledVector(tangent,-transported.dot(tangent)).normalize();
  ups.push(transported.clone());
}
const seamAngle=Math.atan2(
  tangents[0].dot(ups[N].clone().cross(ups[0])),
  THREE.MathUtils.clamp(ups[N].dot(ups[0]),-1,1)
);
const basis=new THREE.Matrix4();
for(let i=0;i<=N;i++) {
  ups[i].applyAxisAngle(tangents[i],seamAngle*i/N);
  rights.push(ups[i].clone().cross(tangents[i]).normalize());
  ups[i].copy(tangents[i]).cross(rights[i]).normalize();
  basis.makeBasis(rights[i],ups[i],tangents[i]);
  frameQuaternions.push(new THREE.Quaternion().setFromRotationMatrix(basis));
}

function railTube(side,vertical,radius,mat) {
  const radial=8,positions=[],normals=[],indices=[];
  for(let i=0;i<=N;i++) {
    const center=trackPoints[i].clone()
      .addScaledVector(rights[i],side)
      .addScaledVector(ups[i],vertical);
    for(let j=0;j<radial;j++) {
      const a=TAU*j/radial;
      const normal=rights[i].clone()
        .multiplyScalar(Math.cos(a))
        .addScaledVector(ups[i],Math.sin(a));
      const p=center.clone().addScaledVector(normal,radius);
      positions.push(p.x,p.y,p.z);
      normals.push(normal.x,normal.y,normal.z);
      if(i<N) {
        const a0=i*radial+j;
        const b0=i*radial+(j+1)%radial;
        const c0=b0+radial;
        const d0=a0+radial;
        indices.push(a0,b0,d0,b0,c0,d0);
      }
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
  geo.setAttribute('normal',new THREE.Float32BufferAttribute(normals,3));
  geo.setIndex(indices);
  geo.computeBoundingSphere();
  return mesh(geo,mat);
}

  for(const px of [-w*.34,0,w*.34]) {
    box(k,.10,1.53,.12,px,2.1,d/2+.15,M.cream);
  }
  const roofAngle=Math.atan2(1.15,d/2+.4);

    const roof=box(k,w+.7,.19,roofLen,0,h+.88,side*(d/2+.4)/2,M.teal);
    roof.rotation.x=side*roofAngle;

  box(k,w+.8,.15,.22,0,h+1.5,0,M.gold);
  for(let i=0;i<10;i++) {

      k,(w+.4)/10,.12,1.5,
      -(w+.4)/2+(i+.5)*(w+.4)/10,3.05,d/2+.63,

    stripe.rotation.x=.16;
    box(k,(w+.4)/10,.32,.1,stripe.position.x,2.79,d/2+1.35,i%2?M.cream:color);

    k,
    Array.from({length:12},(_,i)=>V(-w/2+(i+.5)*w/12,2.78,d/2+1.43)),
    bulbMat,.06
  );
  return k;
}

const fencePosts=[],fenceRails=[],fenceCaps=[];
function fenceLine(a,b) {
  const length=a.distanceTo(b);
  const n=Math.ceil(length/3.1);
  const dir=b.clone().sub(a).normalize();
  for(let i=0;i<=n;i++) {
    const p=a.clone().lerp(b,i/n);
    fencePosts.push({p:V(p.x,.96,p.z),s:V(.17,1.55,.17)});
    fenceCaps.push({p:V(p.x,1.8,p.z),s:V(.16,.16,.16)});
  }
  const q=new THREE.Quaternion().setFromUnitVectors(V(1,0,0),dir);
  for(const y of [.65,1.36]) {
    fenceRails.push({
      p:a.clone().add(b).multiplyScalar(.5).setY(y),
      q,s:V(length,.11,.12)
    });
  }
}

    box(b,.14,.75,.75,px,.4,0,M.dark);
    box(b,.14,1.3,.14,px,.75,-.32,M.dark);
  }
  for(let j=0;j<3;j++) box(b,2.5,.12,.21,0,.8,-.26+j*.25,M.wood);
  for(let j=0;j<2;j++) box(b,2.5,.22,.11,0,1.12+j*.29,-.36,M.wood);
}

function festoon(x1,x2,z) {
  for(const x of [x1,x2]) {
    cylinder(scene,.07,6.2,x,3.3,z,M.teal);
    sphere(scene,x,6.47,z,.14,M.gold);
  }
  const curve=new THREE.QuadraticBezierCurve3(
    V(x1,6.25,z),V((x1+x2)/2,3.8,z),V(x2,6.25,z)
  );
  mesh(new THREE.TubeGeometry(curve,50,.025,5,false),M.dark);
  const ps=[];
  for(let i=0;i<=16;i++) {
    const p=curve.getPoint(i/16);
    beam(scene,p,p.clone().add(V(0,-.18,0)),.018,M.dark);
    ps.push(p.clone().add(V(0,-.23,0)));
  }
  dots(scene,ps,bulbMat,.12);
}

const skinMats=[M.cream,material('#d7a077'),material('#986a52')];
const shirtMats=[M.coral,M.teal,M.blue,M.yellow,M.pink,M.white];
function visitor(x,z,index) {
  const p=group(scene,x,.22,z);
  const s=.7+rand()*.17;
  p.scale.setScalar(s);
  for(const px of [-.17,.17]) {
    cylinder(p,.105,.57,px,.34,0,M.dark);
    box(p,.23,.13,.34,px,.12,.07,M.dark);
  }
  const body=mesh(
    new THREE.CylinderGeometry(.27,.32,.61,8),
    shirtMats[index%shirtMats.length],p
  );
  body.position.y=.86;
  sphere(p,0,1.42,0,.27,skinMats[index%3]);
  sphere(p,0,1.54,-.04,.26,index%3?M.dark:M.wood,V(1,.6,1));
  for(const px of [-.36,.36]) {
    beam(p,V(px,1.08,0),V(px,.62,.08),.085,skinMats[index%3]);
  }
  if(index%5===0) {
    cylinder(p,.34,.09,0,1.61,0,M.yellow);
    sphere(p,0,1.68,0,.25,M.yellow,V(1,.55,1));
  }
  return p;
}

let nightMode=false;
function setNight(value) {
  nightMode=!!value;
  document.body.classList.toggle('night',nightMode);
  document.querySelector('#night').setAttribute('aria-pressed',String(nightMode));
  document.querySelector('#nightIcon').textContent=nightMode?'☀':'☾';
  document.querySelector('#nightLabel').textContent=nightMode?'昼のパークへ':'夜のパークへ';
  document.querySelector('#clockLabel').textContent=nightMode?'20:30':'14:30';
  document.querySelector('#season').textContent=nightMode?'A THOUSAND LITTLE LIGHTS':'ENDLESS SUMMER';

  const bg=nightMode?'#0b1e35':'#cbdedb';
  scene.background.set(bg);
  scene.fog.color.set(bg);
  groundMat.color.set(nightMode?'#163148':'#cbdedb');
  hemi.color.set(nightMode?'#8eabd9':'#e7f7ff');
  hemi.groundColor.set(nightMode?'#263e42':'#83a571');
  hemi.intensity=nightMode?.7:2.0;
  ambient.intensity=nightMode?.18:.2;
  sun.color.set(nightMode?'#adc9ff':'#fff0d5');
  sun.intensity=nightMode?.58:3.2;
  renderer.toneMappingExposure=nightMode?1.13:1.08;
  bulbMat.emissiveIntensity=nightMode?4.4:.35;
  aquaBulb.emissiveIntensity=nightMode?3.3:.35;
  roseBulb.emissiveIntensity=nightMode?3:.25;
  M.window.emissiveIntensity=nightMode?1.8:.04;
  M.water.emissiveIntensity=nightMode?.6:.12;
  nightLights.forEach(({light,intensity})=>{
    light.intensity=nightMode?intensity:0;
  });
  glowSprites.forEach(s=>s.visible=nightMode);
  stars.visible=nightMode;
  moon.visible=nightMode;
  clouds.visible=!nightMode;
}
document.querySelector('#night').onclick=()=>setNight(!nightMode);
addEventListener('keydown',e=>{
  if(e.code==='KeyN'&&!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey) {
    setNight(!nightMode);
  }
});

// フレーム間隔を切り詰めて積算せず、実際の経過時間から姿勢を直接求める。
// 低フレームレートでも観覧車は約45秒で一周し、速度が落ちない。
const animationStart=performance.now();
const WHEEL_ANGULAR_SPEED=.14;
const CAROUSEL_ANGULAR_SPEED=.23;
const COASTER_SPEED=6.7;
const walkDirection=V();

function updateAnimation(elapsed) {
  const wheelAngle=(elapsed*WHEEL_ANGULAR_SPEED)%TAU;
  wheel.rotation.set(0,0,wheelAngle);
  for(const cabin of gondolas) {
    cabin.rotation.set(0,0,-wheelAngle);
  }

  coasterProgress=(initialCoasterProgress+elapsed*COASTER_SPEED/trackLength)%1;
  cars.forEach((car,i)=>{
    placeCar(car,coasterProgress-i*3.15/trackLength);
  });

  carousel.rotation.y=(elapsed*CAROUSEL_ANGULAR_SPEED)%TAU;
  horses.forEach(({object,phase})=>{
    object.position.y=2.35+.28*Math.sin(elapsed*1.8+phase);
  });

  for(let i=0;i<40;i++) {
    const t=(elapsed*.62+(i%5)/5)%1;
    dummy.position.copy(waterArcs[Math.floor(i/5)].getPoint(t));
    dummy.quaternion.identity();
    dummy.scale.setScalar(.045+.025*Math.sin(t*Math.PI));
    dummy.updateMatrix();
    droplets.setMatrixAt(i,dummy.matrix);
  }
  droplets.instanceMatrix.needsUpdate=true;

  walkers.forEach(({object,offset})=>{
    const u=(elapsed*.017+offset)%1;
    object.position.copy(walkCurve.getPointAt(u));
    object.position.y+=Math.abs(Math.sin(elapsed*4+offset*TAU))*.035;
    walkDirection.copy(walkCurve.getTangentAt(u));
    object.rotation.y=Math.atan2(walkDirection.x,walkDirection.z);
  });
}

function animate() {
  const elapsed=(performance.now()-animationStart)*.001;
  updateAnimation(elapsed);
  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
updateAnimation(0);
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
  renderer.setSize(innerWidth,innerHeight);
});
