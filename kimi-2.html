<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const daySky = new THREE.Color('#a9dcf2');
const nightSky = new THREE.Color('#071329');
scene.background = daySky.clone();
scene.fog = new THREE.Fog(daySky.clone(), 72, 165);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 320);
camera.position.set(43, 35, 52);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.065;
controls.minDistance = 24;
controls.maxDistance = 135;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = Math.PI / 2 - 0.035;
controls.update();

const hemi = new THREE.HemisphereLight('#dff5ff', '#668552', 1.65);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff1d4', 2.65);
sun.position.set(28, 46, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -38;
sun.shadow.camera.right = 38;
sun.shadow.camera.top = 38;
sun.shadow.camera.bottom = -38;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 115;
sun.shadow.bias = -0.00035;
sun.shadow.normalBias = 0.035;
scene.add(sun, sun.target);

const V = (x,y,z) => new THREE.Vector3(x,y,z);
const clamp = THREE.MathUtils.clamp;
const lerp = THREE.MathUtils.lerp;
const unitCylinder = new THREE.CylinderGeometry(1,1,1,10);
const yAxis = new THREE.Vector3(0,1,0);

function material(color, roughness=0.75, metalness=0) {
  return new THREE.MeshStandardMaterial({color, roughness, metalness});
}
function addBox(parent,w,h,d,x,y,z,mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
function addCylinder(parent,rt,rb,h,x,y,z,mat,segments=20) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,segments),mat);
  m.position.set(x,y,z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
function beam(parent,a,b,r,mat) {
  const direction = b.clone().sub(a);
  const length = direction.length();
  const m = new THREE.Mesh(unitCylinder,mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.scale.set(r,length,r);
  m.quaternion.setFromUnitVectors(yAxis,direction.normalize());
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
function shadows(root) {
  root.traverse(o => {
    if(o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
    }
  });
}

let randomSeed = 928374;
function rand() {
  randomSeed |= 0;
  randomSeed = randomSeed + 0x6D2B79F5 | 0;
  let t = Math.imul(randomSeed ^ randomSeed >>> 15, 1 | randomSeed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

const glowEntries = [];
const nightLights = [];
function glowMaterial(color,power=2.5) {
  const m = new THREE.MeshStandardMaterial({
    color, emissive:color, emissiveIntensity:0.18, roughness:0.3, metalness:0.05
  });
  glowEntries.push({material:m,power});
  return m;
}
function addNightLight(parent,color,power,distance,x,y,z) {
  const light = new THREE.PointLight(color,0,distance,2);
  light.position.set(x,y,z);
  parent.add(light);
  nightLights.push({light,power});
  return light;
}

const cream = material('#fff0cf');
const white = material('#fff8e8');

const grassCanvas = document.createElement('canvas');
grassCanvas.width = grassCanvas.height = 256;
const gc = grassCanvas.getContext('2d');
gc.fillStyle = '#77ad62';
gc.fillRect(0,0,256,256);
for(let i=0;i<3200;i++) {

  gc.fillStyle = light ? 'rgba(208,230,133,.16)' : 'rgba(31,94,51,.13)';
  const s = 0.5 + rand()*1.6;
  gc.fillRect(rand()*256,rand()*256,s,s);
}
const grassTexture = new THREE.CanvasTexture(grassCanvas);
grassTexture.wrapS = grassTexture.wrapT = THREE.RepeatWrapping;
grassTexture.repeat.set(12,10);
grassTexture.colorSpace = THREE.SRGBColorSpace;

addBox(scene,60,1.7,48,0,-0.92,0,material('#624c3d'));
addBox(scene,59.3,0.34,47.3,0,-0.02,0,
  new THREE.MeshStandardMaterial({map:grassTexture,color:'#ffffff',roughness:1}));
addBox(scene,60.5,0.25,48.5,0,-1.78,0,material('#352f35',0.6,0.15));

const pathMat = material('#e8cf9d',0.98);
const pathEdgeMat = material('#c7a979',1);

function makeRibbon(points,width,mat=pathMat,y=0.18) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => V(p[0],y,p[1])),false,'centripetal');
  const segments = Math.max(24,points.length*14);
  const positions = [], uvs = [], indices = [];
  for(let i=0;i<=segments;i++) {
    const u = i/segments;
    const p = curve.getPoint(u);
    const t = curve.getTangent(u);
    const side = V(t.z,0,-t.x).normalize().multiplyScalar(width/2);
    const a = p.clone().add(side), b = p.clone().sub(side);
    positions.push(a.x,a.y,a.z,b.x,b.y,b.z);
    uvs.push(0,u*6,1,u*6);
    if(i<segments) {
      const k=i*2;
      indices.push(k,k+1,k+2,k+1,k+3,k+2);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
  geo.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo,mat);
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

makeRibbon([[0,10],[-5,9],[-9,8],[-13,8]],3.1);
makeRibbon([[0,8],[-4,4],[-9,1],[-15,-1]],3.0);
makeRibbon([[0,8],[6,9],[12,11],[19,12]],3.1);
makeRibbon([[1,5],[6,2],[11,0],[16,-1]],2.6);
makeRibbon([[-1,14],[-7,16],[-13,17],[-18,18]],2.1);

plaza.rotation.x = -Math.PI/2;
plaza.position.set(0,0.185,11);
plaza.receiveShadow = true;
scene.add(plaza);

scene.add(plazaRing);

/* 看板はすべて Canvas から生成 */
function labelTexture(text,bg='#e95762',fg='#fff8df',sub='') {
  const c = document.createElement('canvas');
  c.width=1024; c.height=256;
  const x=c.getContext('2d');
  x.fillStyle=bg;
  x.beginPath();
  x.moveTo(45,8); x.lineTo(979,8); x.quadraticCurveTo(1016,8,1016,45);
  x.lineTo(1016,211); x.quadraticCurveTo(1016,248,979,248);
  x.lineTo(45,248); x.quadraticCurveTo(8,248,8,211);
  x.lineTo(8,45); x.quadraticCurveTo(8,8,45,8); x.closePath(); x.fill();
  x.strokeStyle='rgba(255,255,255,.65)'; x.lineWidth=8; x.stroke();
  x.fillStyle=fg; x.textAlign='center'; x.textBaseline='middle';
  x.font=`800 ${sub?102:122}px system-ui,sans-serif`;
  x.fillText(text,512,sub?105:132);
  if(sub) {
    x.font='600 37px system-ui,sans-serif';
    x.fillText(sub,512,194);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  return tex;
}
function makeLabel(text,w,h,bg,fg,sub='') {
  const mat = new THREE.MeshBasicMaterial({
    map:labelTexture(text,bg,fg,sub),transparent:true,side:THREE.DoubleSide,toneMapped:false
  });
  return new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
}

/* 噴水 */
const fountain = new THREE.Group();
fountain.position.set(0,0,11);
scene.add(fountain);
addCylinder(fountain,2.15,2.3,0.5,0,0.42,0,cream,48);
addCylinder(fountain,1.9,1.9,0.12,0,0.7,0,
  new THREE.MeshStandardMaterial({color:'#58c4df',roughness:0.18,metalness:0.12}),48);
addCylinder(fountain,0.32,0.45,1.75,0,1.35,0,cream,24);
addCylinder(fountain,0.9,0.65,0.22,0,2.05,0,cream,32);
const fountainOrb = new THREE.Mesh(new THREE.SphereGeometry(0.32,20,14),gold);
fountainOrb.position.y=2.55; fountain.add(fountainOrb);
const waterJetMat = new THREE.MeshStandardMaterial({
  color:'#b8f3ff',emissive:'#4baac4',emissiveIntensity:0.22,roughness:0.1,transparent:true,opacity:0.78
});
for(let i=0;i<8;i++) {
  const a=i*Math.PI/4;
  const curve=new THREE.QuadraticBezierCurve3(
    V(Math.cos(a)*0.25,2.1,Math.sin(a)*0.25),
    V(Math.cos(a)*1.0,2.8,Math.sin(a)*1.0),
    V(Math.cos(a)*1.55,0.82,Math.sin(a)*1.55)
  );
  fountain.add(new THREE.Mesh(new THREE.TubeGeometry(curve,20,0.025,5,false),waterJetMat));
}
shadows(fountain);

/* 柵 */
const fenceMat = material('#f5e6ca');
function fenceLine(x1,z1,x2,z2,spacing=2) {
  const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz);
  const n=Math.ceil(len/spacing);
  for(let i=0;i<=n;i++) {
    const t=i/n;
    addBox(scene,0.16,1.15,0.16,lerp(x1,x2,t),0.72,lerp(z1,z2,t),fenceMat);
  }
  for(const y of [0.52,0.96]) {
    const rail=addBox(scene,len,0.11,0.11,(x1+x2)/2,y,(z1+z2)/2,fenceMat);
    rail.rotation.y=-Math.atan2(dz,dx);
  }
}
fenceLine(-28,-22,28,-22);
fenceLine(-28,-22,-28,22);
fenceLine(28,-22,28,22);
fenceLine(-28,22,-4,22);
fenceLine(4,22,28,22);

/* 木 */
const trunkMat = material('#765137');
const leafMats = [material('#3d8852'),material('#55a85c'),material('#74ad54'),material('#34734e')];
function tree(x,z,s=1,type=0) {
  const g=new THREE.Group();
  g.position.set(x,0.15,z);
  scene.add(g);
  addCylinder(g,0.16*s,0.23*s,2.1*s,0,1.05*s,0,trunkMat,9);
  if(type===1) {
    for(let i=0;i<3;i++) {
      const crown=new THREE.Mesh(new THREE.ConeGeometry((1.25-i*0.18)*s,2.25*s,9),leafMats[(i+1)%leafMats.length]);
      crown.position.y=(2.1+i*0.9)*s;
      crown.castShadow=crown.receiveShadow=true;
      g.add(crown);
    }
  } else {
    const offsets=[[0,2.55,0],[-.65,2.35,.15],[.58,2.42,.25],[.05,2.45,-.55]];
    offsets.forEach((p,i)=>{
      const leaf=new THREE.Mesh(new THREE.IcosahedronGeometry((i?0.9:1.15)*s,1),leafMats[i%leafMats.length]);
      leaf.position.set(p[0]*s,p[1]*s,p[2]*s);
      leaf.castShadow=leaf.receiveShadow=true;
      g.add(leaf);
    });
  }
}
[
 [-25,-18,1.15,1],[-20,-19,1,0],[-10,-19,1.1,1],[0,-19,.9,0],[12,-19,1.1,1],

const lampGlow = glowMaterial('#ffd88c',3.5);
function streetLamp(x,z,realLight=true) {
  const g=new THREE.Group();
  g.position.set(x,0.15,z);
  scene.add(g);
  addCylinder(g,0.075,0.12,2.85,0,1.43,0,metalDark,10);
  addCylinder(g,0.25,0.32,0.12,0,0.08,0,metalDark,12);
  const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.24,16,12),lampGlow);
  bulb.position.y=3.02; g.add(bulb);
  const cap=new THREE.Mesh(new THREE.ConeGeometry(0.38,0.28,12),metalDark);
  cap.position.y=3.34; g.add(cap);
  if(realLight) addNightLight(g,'#ffd397',15,10,0,2.9,0);
  shadows(g);
}
[
 [-3,17],[3,17],[-3.8,8],[3.8,8],[-8,2],[-19,0],[8,11],[17,11],[23,8]

/* 建物 */
function building(x,z,w,d,h,bodyColor,roofColor,name) {
  const g=new THREE.Group();
  g.position.set(x,0.15,z);
  scene.add(g);
  const wall=material(bodyColor);
  addBox(g,w,h,d,0,h/2,0,wall);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(1,1,4),material(roofColor));
  roof.scale.set((w+0.8)*0.73,1.65,(d+0.8)*0.73);
  roof.rotation.y=Math.PI/4;
  roof.position.y=h+0.82;
  g.add(roof);
  addBox(g,w+0.25,0.18,d+0.25,0,h+0.02,0,cream);
  addBox(g,w*0.18,h*0.47,0.08,0,h*0.235,d/2+0.045,darkWood);
  for(const sx of [-1,1]) {
    addBox(g,w*0.2,h*0.25,0.07,sx*w*0.29,h*0.57,d/2+0.05,windowGlow);
    addBox(g,w*0.22,0.08,0.12,sx*w*0.29,h*0.57-0.02,d/2+0.09,cream);
  }
  if(name) {
    const sign=makeLabel(name,w*0.72,0.75,roofColor,'#fff7dc');
    sign.position.set(0,h*0.88,d/2+0.09);
    g.add(sign);
  }
  addNightLight(g,'#ffbd69',8,7,0,h*0.65,d/2+0.5);
  shadows(g);
  return g;
}
building(-5.4,19.3,3.6,3.1,3.0,'#f4bb62','#d6535e','TICKETS');

/* ベンチと植木鉢 */
function bench(x,z,rotation=0) {
  const g=new THREE.Group();
  g.position.set(x,0.2,z); g.rotation.y=rotation; scene.add(g);
  addBox(g,2.0,0.18,0.62,0,0.65,0,darkWood);
  addBox(g,2.0,0.75,0.14,0,1.05,-0.32,darkWood);
  for(const sx of [-.72,.72]) {
    addBox(g,.13,.65,.13,sx,.32,-.18,metalDark);
    addBox(g,.13,.65,.13,sx,.32,.18,metalDark);
  }
}

const flowerColors=['#ff7f91','#ffd466','#f6a5dd','#ffffff'];
function planter(x,z) {
  addCylinder(scene,0.75,0.6,0.45,x,0.4,z,material('#b76e50'),16);
  for(let i=0;i<11;i++) {
    const a=rand()*Math.PI*2,r=rand()*0.57;
    const stem=V(x+Math.cos(a)*r,0.78+rand()*.18,z+Math.sin(a)*r);
    beam(scene,V(stem.x,.58,stem.z),stem,.018,leafMats[0]);
    const f=new THREE.Mesh(new THREE.SphereGeometry(.11,8,6),material(flowerColors[i%flowerColors.length]));
    f.position.copy(stem); scene.add(f);
  }
}
planter(-4.2,14.7); planter(4.2,14.7); planter(-4.2,7.5); planter(4.2,7.5);

axle.rotation.x=Math.PI/2;

const wheel=new THREE.Group();

scene.add(wheel);
const wheelR=7.25;
const rimMat=material('#f6eee0',0.35,0.4);
for(const z of [-.48,.48]) {
  const rim=new THREE.Mesh(new THREE.TorusGeometry(wheelR,.13,10,96),rimMat);

/* ジェットコースター：垂直ループ＋外周コース */
class ParkCoasterCurve extends THREE.Curve {
  constructor() {
    super();
    this.loopFraction=.38;
    this.outer=new THREE.CatmullRomCurve3([
      V(7,2,-8),V(13,2,-8),V(18,2.2,-8),V(22,4.5,-4),
      V(22,6,1),V(19,4.5,5),V(13,2.4,7),V(6,3.2,7),
      V(0,5.5,5),V(-2,6,1),V(-2,4,-4),V(0,2,-8),V(7,2,-8)
    ],false,'centripetal',.5);
    this.arcLengthDivisions=1600;
    this.updateArcLengths();
  }
  getPoint(t,target=new THREE.Vector3()) {
    if(t<=this.loopFraction) {
      const a=t/this.loopFraction*Math.PI*2;
      return target.set(7+4.5*Math.sin(a),2+4.5*(1-Math.cos(a)),-8);
    }
    return this.outer.getPoint((t-this.loopFraction)/(1-this.loopFraction),target);
  }
}
const coasterCurve=new ParkCoasterCurve();
const FRAME_COUNT=480;
const frameUps=[],frameTangents=[],frameSides=[];
for(let i=0;i<FRAME_COUNT;i++) frameTangents.push(coasterCurve.getTangentAt(i/FRAME_COUNT).normalize());
for(let i=0;i<FRAME_COUNT;i++) {
  const t=frameTangents[i];
  const up=new THREE.Vector3();
  if(i===0) up.set(0,1,0);
  else {
    const q=new THREE.Quaternion().setFromUnitVectors(frameTangents[i-1],t);
    up.copy(frameUps[i-1]).applyQuaternion(q);
  }
  up.addScaledVector(t,-up.dot(t)).normalize();
  if(up.lengthSq()<.1) up.set(0,1,0).addScaledVector(t,-t.y).normalize();
  frameUps.push(up);
}
/* 閉曲線の継ぎ目でフレームがねじれないよう補正 */
{
  const q=new THREE.Quaternion().setFromUnitVectors(
    frameTangents[FRAME_COUNT-1],frameTangents[0]
  );
  const endUp=frameUps[FRAME_COUNT-1].clone().applyQuaternion(q);
  endUp.addScaledVector(frameTangents[0],-endUp.dot(frameTangents[0])).normalize();
  const cross=new THREE.Vector3().crossVectors(frameUps[0],endUp);
  const angle=Math.atan2(frameTangents[0].dot(cross),frameUps[0].dot(endUp));
  for(let i=0;i<FRAME_COUNT;i++) {
    frameUps[i].applyAxisAngle(frameTangents[i],-angle*i/FRAME_COUNT).normalize();
  }
}
for(let i=0;i<FRAME_COUNT;i++) {
  frameSides.push(new THREE.Vector3().crossVectors(frameUps[i],frameTangents[i]).normalize());
}
function trackFrame(u) {
  u=((u%1)+1)%1;
  const f=u*FRAME_COUNT;
  const i=Math.floor(f)%FRAME_COUNT;
  const j=(i+1)%FRAME_COUNT;
  const a=f-Math.floor(f);
  const p=coasterCurve.getPointAt(u);
  const tangent=coasterCurve.getTangentAt(u).normalize();
  const up=frameUps[i].clone().lerp(frameUps[j],a).normalize();
  up.addScaledVector(tangent,-up.dot(tangent)).normalize();
  const side=new THREE.Vector3().crossVectors(up,tangent).normalize();
  return {p,tangent,up,side};
}

/* 昼夜切り替え */
let night=false;
let nightMix=0;
const nightButton=document.getElementById('nightButton');
function setNight(value) {
  night=!!value;
  nightButton.classList.toggle('night',night);
  nightButton.setAttribute('aria-pressed',String(night));
  nightButton.textContent=night?'☀️ 昼に切り替え':'🌙 夜に切り替え';
}
nightButton.addEventListener('click',()=>setNight(!night));

function updateDayNight(dt) {
  const target=night?1:0;
  nightMix=lerp(nightMix,target,1-Math.exp(-dt*3.2));
  scene.background.copy(daySky).lerp(nightSky,nightMix);
  scene.fog.color.copy(daySky).lerp(nightSky,nightMix);
  hemi.intensity=lerp(1.65,.32,nightMix);
  hemi.color.set('#dff5ff').lerp(new THREE.Color('#536fa8'),nightMix);
  hemi.groundColor.set('#668552').lerp(new THREE.Color('#18223c'),nightMix);
  sun.intensity=lerp(2.65,.2,nightMix);
  sun.color.set('#fff1d4').lerp(new THREE.Color('#91aaff'),nightMix);
  for(const e of glowEntries) e.material.emissiveIntensity=.16+e.power*nightMix;
  for(const e of nightLights) e.light.intensity=e.power*nightMix;
  starMat.opacity=nightMix;
  stars.visible=nightMix>.01;
  moonMat.opacity=nightMix;
  moon.visible=nightMix>.01;
  sunMat.opacity=1-nightMix;
  sunMesh.visible=nightMix<.99;
  cloudMat.opacity=.82*(1-nightMix*.88);
  renderer.toneMappingExposure=lerp(1.08,1.18,nightMix);
}

/* 自動検査用 API */
window.park={
  scene,camera,renderer,
  wheel,gondolas,
  coasterCurve,
  coasterCar:train[0],
  getCoasterProgress:()=>coasterProgress,
  carousel,
  setNight,
  isNight:()=>night
};

let previousTime=performance.now();
let elapsed=0;
function animate(now) {
  const dt=Math.min((now-previousTime)/1000,.05);
  previousTime=now;
  elapsed+=dt;

  wheel.rotation.z+=dt*.115;
  for(const gondola of gondolas) gondola.rotation.z=-wheel.rotation.z;

  carousel.rotation.y+=dt*.34;
  for(const horse of horses) {
    horse.position.y=horse.userData.baseY+Math.sin(elapsed*2.1+horse.userData.phase)*.27;
  }

  coasterProgress=(coasterProgress+dt*.037)%1;
  updateTrain();

  fountainOrb.rotation.y+=dt;
  updateDayNight(dt);
  controls.update();
  renderer.render(scene,camera);
}
renderer.setAnimationLoop(animate);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
});
